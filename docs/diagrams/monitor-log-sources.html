<rect x="56" y="788" width="1348" height="288" rx="8" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="72" y="782" width="140" height="12" fill="#f5f5f5"/><text x="142" y="791" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text><circle cx="84" cy="820" r="9" fill="#2d3142"/><text x="84" y="823.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text><text x="108" y="824" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Connect in Integrations does the whole sign-in for a source: pup for Datadog, the folder dialog for the Log folder, the AWS CLI for CloudWatch, Grafana Cloud for Loki,</text><text x="108" y="840" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and Claude Code&#x27;s MCP sign-in or a User API key for New Relic. A Scan reads a source only while it is connected and answering; with none connected, Scan says so.</text><circle cx="84" cy="864" r="9" fill="#2d3142"/><text x="84" y="867.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text><text x="108" y="868" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A Scan reads failing requests: HTTP status 400 or more, or the codes the operator picked. The Log folder, CloudWatch, Loki and New Relic also count logs at error level or above.</text><text x="108" y="884" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Logs with no env count as the env no env. The Fingerprint of an Alert from any source but Datadog includes the source, so one failure in two sources is two Alerts.</text><circle cx="84" cy="908" r="9" fill="#2d3142"/><text x="84" y="911.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text><text x="108" y="912" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Each connected source is scanned on its own 6 h grid from its Connector&#x27;s daily scan time, and a Service may use 12 h or 24 h. The operator&#x27;s Scan picks 15 min to 7 days and can stop a running Scan.</text><text x="108" y="928" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A source that fails or is throttled ends its Scan as failed or rate limited and leaves the others alone.</text><circle cx="84" cy="952" r="9" fill="#2d3142"/><text x="84" y="955.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text><text x="108" y="956" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Samples keep at most 25 logs per Alert. Values under keys that look like passwords, tokens, cookies, authorization or request bodies, and secrets in message text, are redacted before they are stored.</text><circle cx="84" cy="980" r="9" fill="#2d3142"/><text x="84" y="983.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text><text x="108" y="984" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A Recheck reads the same source for the Alert&#x27;s own query over the last hour when a Verification or a Fix starts, with no model turn. The agent&#x27;s log tools follow the source:</text><text x="108" y="1000" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">pup and the Datadog MCP Server, or the CloudWatch, Grafana or New Relic MCP Server, or the console&#x27;s NRQL tool for a User API key. The Log folder has none; the agent works from the Samples.</text><circle cx="84" cy="1024" r="9" fill="#2d3142"/><text x="84" y="1027.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text><text x="108" y="1028" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Monitor shows one tab per source with its open Alerts by tier and one line of state, then the alerts table and an Alert drawer. A source that goes down stays listed.</text><text x="108" y="1044" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">An open Alert no Scan saw for 14 days resolves, and Scans and Alert events older than 30 days are deleted. Scans a stopped daemon missed run once, in the start-up queue.</text>
