<text x="78" y="788" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Sandbox unavailable: the run fails before its first command. No Setting, flag or retry runs a command outside it.</text>
<text x="78" y="810" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ssh, Node fetch, raw IPs, DNS and UDP skip the proxy and fail. A run keeps the allowlist it started with.</text>
<text x="78" y="832" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A PROD write waits for an Approval in every Access mode, full included. Log row is written before any Bash or MCP call.</text>
<text x="78" y="854" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Pull request, join_repo and save_file ask in every mode. save_file copies one output file; the daemon writes it.</text>
<text x="78" y="876" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Never forces. A branch that moved gives branch_moved and opens nothing. Host not connected: refused before the push.</text>
<text x="78" y="898" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Stop, or a daemon restart, expires pending Approvals and fails the run. A denied request is not retried.</text>
<text x="78" y="920" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Agent Review, Reply check and Comment pass also deny git push and CLI comment, review and api. Merge is a button.</text>
<text x="78" y="942" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">MCP servers run outside the sandbox. Access Level and the PROD tag decide what the agent may call.</text>
<text x="78" y="964" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CLIProxy must be loopback. A Keychain call over 60 s fails keychain_timeout, and a late answer is dropped.</text>
