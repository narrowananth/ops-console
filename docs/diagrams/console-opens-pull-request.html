<text x="142" y="647" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="676" r="9" fill="#2d3142"/>
<text x="84" y="679.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="680" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The button shows only on a repo Session whose branch is not the default, has commits the base lacks and has no open pull request. It is disabled while drafting, pending, or with an empty title or base.</text>
<text x="108" y="696" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Anonymous and local-Repo Sessions have none.</text>
<circle cx="84" cy="720" r="9" fill="#2d3142"/>
<text x="84" y="723.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="724" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The agent drafts from the Session diff and changes nothing. A failed draft leaves the fields empty for the operator to write. Uncommitted files are left out, and the form says &quot;N file(s) have changes that</text>
<text x="108" y="740" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">are not committed&quot;.</text>
<circle cx="84" cy="764" r="9" fill="#2d3142"/>
<text x="84" y="767.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="768" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A reload mid-draft closes the form. Two clicks at once, or two browsers, open one pull request: the second confirm finds the open one, with no error and no duplicate. A moved branch returns 409 branch_moved.</text>
<circle cx="84" cy="792" r="9" fill="#2d3142"/>
<text x="84" y="795.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="796" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Only a Session in a Repo, in the Repo&#x27;s own folder, on a supported host is offered the tool. A call with nothing to open (default branch, no new commits, no host) is refused before any Approval, with the</text>
<text x="108" y="812" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">reason.</text>
<circle cx="84" cy="836" r="9" fill="#2d3142"/>
<text x="84" y="839.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="840" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The agent never pushes or opens a pull request itself, in any Session kind or Access mode; its prompt says the console does. The Run sandbox blocks ~/.ssh and ssh ignores the Network allowlist, so the daemon</text>
<text x="108" y="856" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">does it.</text>
<circle cx="84" cy="880" r="9" fill="#2d3142"/>
<text x="84" y="883.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="884" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Approval asks in every Access mode, full included. Nothing is pushed before the yes. A no pushes nothing and the agent is told not to retry. Stop or a daemon restart expires a pending Approval.</text>
<circle cx="84" cy="908" r="9" fill="#2d3142"/>
<text x="84" y="911.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text>
<text x="108" y="912" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Runs in the daemon, outside the Run sandbox, with the Repo&#x27;s own origin remote and keys. Never forced. Every push and opening writes an Action Log row first and finishes it ok or failed.</text>
<circle cx="84" cy="936" r="9" fill="#2d3142"/>
<text x="84" y="939.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">8</text>
<text x="108" y="940" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">GitHub through gh, GitLab through glab, Bitbucket through bkt. A Connector that is not connected fails with connector_not_connected and a link to Integrations. A Fix&#x27;s PR stage uses the same call after the</text>
