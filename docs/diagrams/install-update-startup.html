<text x="78" y="740" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">macOS older than 13.5 is refused. A bad or missing checksum aborts and leaves current alone. OPS_CONSOLE_RELEASE_URL tests a local build.</text>
<text x="78" y="757" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Node sits inside the app, so macOS names the daemon Ops Console. Releases on one Node keep Keychain and Full Disk Access; a new Node makes a new app.</text>
<text x="78" y="774" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Switched off under Login Items it does not start at login. OPS_CONSOLE_PORT at start goes into the plist. Dev runs on 4556 with Keychain service ops-console-dev.</text>
<text x="78" y="791" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Order: data folder lock, migrations in one transaction, start-up recovery, open the port, start the scheduler, write runtime.json.</text>
<text x="78" y="808" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The daemon Keychain reads wait up to 90 s for the handover, then fail keychain_timeout. A call pending over 10 s shows a banner on every page.</text>
<text x="78" y="825" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Update waits for running agent runs, or installs now if the operator picks it. A restart fails live runs and expires their Approvals.</text>
<text x="78" y="842" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Only the newest and previous versions are kept, so a bad release can be rolled back by pointing current at the previous one.</text>
