<text x="142" y="647" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="676" r="9" fill="#2d3142"/>
<text x="84" y="679.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="680" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Nine Connectors: Datadog, Jira, GitHub, GitLab, Bitbucket, Slack, Sentry, Shopify, slashdocs. Site, host, project, channel, workspace and org are set through PATCH /connectors/:id only. Shopify needs no</text>
<text x="108" y="696" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sign-in: Connect registers it.</text>
<circle cx="84" cy="720" r="9" fill="#2d3142"/>
<text x="84" y="723.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="724" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Each Connector uses its own flow: pup auth login, gh auth login --web (the code is copied and shown), claude mcp login in a pty for OAuth ones, bkt in two stages. Connect while waiting aborts the old</text>
<text x="108" y="740" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">attempt. Cancel keeps the earlier status.</text>
<circle cx="84" cy="764" r="9" fill="#2d3142"/>
<text x="84" y="767.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="768" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Homebrew installs a missing gh, glab or GitHub MCP server (10 min cap). With no Homebrew: &quot;&lt;cmd&gt; is not installed and Homebrew is missing&quot;. bkt and pup have no brew install.</text>
<circle cx="84" cy="792" r="9" fill="#2d3142"/>
<text x="84" y="795.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="796" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">GitHub&#x27;s token goes to the Keychain as GITHUB_PERSONAL_ACCESS_TOKEN, a stdio server&#x27;s env vars as mcp:&lt;name&gt;; the server launches through ops-console mcp-exec. Values are never shown.</text>
<circle cx="84" cy="820" r="9" fill="#2d3142"/>
<text x="84" y="823.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="824" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Registration runs in every Claude account. Jira and Bitbucket share the atlassian server. slashdocs is a CLI sign-in only and has no MCP server.</text>
<circle cx="84" cy="848" r="9" fill="#2d3142"/>
<text x="84" y="851.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="852" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A silent tool is fail, signed out is auth, a disabled or unregistered server is named. MCP-only Connectors follow their server&#x27;s Probe: one SDK session per account, no model turn, 30 s each. A check older</text>
<text x="108" y="868" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">than a finished sign-in is discarded.</text>

<text x="108" y="896" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Disconnect signs out, clears status, login and label, aborts a waiting sign-in, and removes the MCP server unless another connected Connector rides it. The operator&#x27;s own terminal stays signed in to the CLI.</text>
<text x="108" y="912" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Monitor and tasks relying on it pause.</text>

<text x="108" y="940" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A failed or cancelled sign-in leaves its detail as an alert in the pane, and the Connector keeps the status it had before Connect.</text>
