  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>

  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-      <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <section style=\"flex:1;min-width:0;min-height:0;overflow:auto\">\n    <div style=\"display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:2px solid var(--color-divider);flex-wrap:wrap\">\n      <h4 style=\"margin:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:18px\">{{ msvc.id }}<\u002Fh4>\n      <span style=\"font-size:12px;color:var(--color-neutral-700)\">repo {{ msvc.repo }} · {{ msvc.env }}<\u002Fspan>\n      <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ msvc.lastCheck }} · checked {{ msvc.interval }}<\u002Fspan>\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ msvc.onCheck }}\" style=\"margin-left:auto;padding:6px 14px\">{{ msvc.checkLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ msvc.hasLog }}\">\n      <div class=\"term\" style=\"background:var(--color-neutral-900);padding:10px 24px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.7;border-bottom:1px solid var(--color-divider)\">\n        <sc-for list=\"{{ msvc.log }}\" as=\"l\" hint-placeholder-count=\"3\"><div style=\"white-space:pre-wrap;color:{{ l.color }};font-weight:{{ l.weight }}\">{{ l.t }}<\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:16px 24px 6px;display:flex;align-items:baseline;gap:10px\"><span style=\"font-weight:800\">Routes<\u002Fspan><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ msvc.routeSummary }}<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:0 24px\">\n      <div style=\"border:1px solid var(--color-divider)\">\n        <sc-for list=\"{{ msvc.routes }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ r.onOpen }}\" style=\"display:grid;grid-template-columns:62px minmax(0,1.3fr) 80px 130px minmax(0,1.6fr);gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--color-neutral-300);border-left:3px solid {{ r.selBd }};background:{{ r.selBg }};cursor:{{ r.cursor }};font-size:13px\">\n            <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700\">{{ r.m }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.p }}<\u002Fspan>\n            <span style=\"font-size:12px;text-align:right\">{{ r.count }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:700;padding:2px 6px;border:1px solid {{ r.tBd }};color:{{ r.tColor }};background:{{ r.tBg }};justify-self:start\">{{ r.trend }}<\u002Fspan>\n            <span style=\"font-size:12px;color:var(--color-neutral-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.note }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ life.show }}\">\n      <div style=\"padding:20px 24px 28px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\"><span style=\"font-weight:800;font-size:17px\">{{ life.title }}<\u002Fspan><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ life.route }} · {{ life.meta }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;border:1px solid var(--color-divider)\">\n          <sc-for list=\"{{ life.stages }}\" as=\"g\" hint-placeholder-count=\"9\"><div style=\"flex:1 1 90px;padding:8px 10px;border-right:1px solid var(--color-neutral-300);border-top:3px solid {{ g.bd }};min-width:90px\"><div style=\"font-size:12px;font-weight:700;color:{{ g.color }}\">{{ g.label }}<\u002Fdiv><div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ g.state }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"font-weight:700;font-size:13px;flex:1\">Failing log from Datadog<\u002Fspan>\n            <div style=\"display:flex;border:1px solid var(--color-divider)\"><sc-for list=\"{{ life.logTabs }}\" as=\"b\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ b.onClick }}\" style=\"padding:3px 10px;border:0;background:{{ b.bg }};color:{{ b.color }};cursor:pointer;font-size:12px\">{{ b.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ life.onCopyJson }}\" style=\"font-size:12px\">{{ life.copyLabel }}<\u002Fbutton><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-neutral-700)\"><button sc-camel-on-click=\"{{ life.onPrevEv }}\" title=\"Previous event\" style=\"border:1px solid var(--color-divider);background:transparent;cursor:pointer;padding:0 7px;color:var(--color-text)\">‹<\u002Fbutton><span>{{ life.evLabel }}<\u002Fspan><button sc-camel-on-click=\"{{ life.onNextEv }}\" title=\"Next event\" style=\"border:1px solid var(--color-divider);background:transparent;cursor:pointer;padding:0 7px;color:var(--color-text)\">›<\u002Fbutton><span style=\"margin-left:auto\">{{ life.evTime }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ life.showMsg }}\"><div class=\"term\" style=\"background:var(--color-neutral-900);color:var(--color-neutral-100);padding:10px 14px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;white-space:pre-wrap\">{{ life.line }}<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ life.showJson }}\"><div class=\"term\" style=\"background:var(--color-neutral-900);color:var(--color-neutral-100);padding:10px 14px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.6;white-space:pre;overflow:auto;max-height:360px\">{{ life.json }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ life.canVerify }}\"><div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ life.onVerify }}\">Verify with agent<\u002Fbutton><span style=\"font-size:12px;color:var(--color-neutral-700)\">Maps the log to the local code, replays the Datadog payload with curl against the repo running locally, and cross-checks the data with your dev tools.<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n\n        <sc-if value=\"{{ life.hasVlog }}\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-weight:700;font-size:13px\">Verification<\u002Fdiv>\n            <div class=\"term\" style=\"background:var(--color-neutral-900);padding:10px 14px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.7\"><sc-for list=\"{{ life.vlog }}\" as=\"l\" hint-placeholder-count=\"4\"><div style=\"white-space:pre-wrap;color:{{ l.color }};font-weight:{{ l.weight }}\">{{ l.t }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ life.hasReport }}\">\n          <div style=\"border:2px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--color-divider);background:var(--color-neutral-200)\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;flex:1\">{{ life.reportPath }}<\u002Fspan><span style=\"font-size:11px;color:var(--color-neutral-700)\">Generated report<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:12px 16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.65;white-space:pre-wrap;max-height:340px;overflow:auto\">{{ life.report }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ life.needsReview }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;border:2px solid var(--color-accent);background:var(--color-accent-100)\">\n            <div style=\"font-weight:800\">Your review<\u002Fdiv>\n            <div style=\"font-size:13px\">The agent recommends a Jira <strong>{{ life.recommend }}<\u002Fstrong>. After you confirm, it creates the ticket in OPS, checks out a branch named after it, implements the change, verifies it and opens a PR. Nothing is merged without you.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ life.onBug }}\">Confirm · create Jira bug<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ life.onImprove }}\">Confirm · create Jira improvement<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ life.onDismiss }}\">Dismiss<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ life.isDismissed }}\"><div style=\"font-size:13px;color:var(--color-neutral-700);padding:10px 12px;border:1px dashed var(--color-neutral-400)\">Dismissed. The route stays on the report and is checked again at the next scan. <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ life.onUndismiss }}\" style=\"font-size:12px\">Undo<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n\n        <sc-if value=\"{{ life.hasJira }}\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--color-divider);flex-wrap:wrap\">\n            <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800;font-size:14px\">{{ life.jira }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:700;padding:2px 8px;border:1px solid var(--color-text)\">{{ life.kind }}<\u002Fspan>\n            <span style=\"font-size:13px;flex:1;min-width:160px\">{{ life.title }}<\u002Fspan>\n            <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ life.jiraStatus }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ life.hasPlog }}\">\n          <div class=\"term\" style=\"background:var(--color-neutral-900);padding:10px 14px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.7\"><sc-for list=\"{{ life.plog }}\" as=\"l\" hint-placeholder-count=\"4\"><div style=\"white-space:pre-wrap;color:{{ l.color }};font-weight:{{ l.weight }}\">{{ l.t }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ life.hasDiff }}\">\n          <div style=\"border:1px solid var(--color-divider);overflow-x:auto\"><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;padding:6px 12px;background:var(--color-neutral-200)\">{{ life.file }} · on {{ life.branch }}<\u002Fdiv><sc-for list=\"{{ life.diff }}\" as=\"d\" hint-placeholder-count=\"4\"><div style=\"display:flex;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.7;background:{{ d.bg }};color:{{ d.color }};white-space:pre;min-width:max-content\"><span style=\"width:24px;flex:none;text-align:center;color:{{ d.signColor }}\">{{ d.sign }}<\u002Fspan><span style=\"padding-right:12px\">{{ d.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ life.hasPr }}\"><div style=\"display:flex;gap:10px;align-items:center\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ life.onOpenPr }}\">Review PR {{ life.prLabel }} in Workspace<\u002Fbutton><span style=\"font-size:12px;color:var(--color-neutral-700)\">Jira {{ life.jira }} is linked and moved to In review.<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ life.none }}\"><div style=\"padding:20px 24px;font-size:13px;color:var(--color-neutral-700)\">{{ life.noneText }}<\u002Fdiv><\u002Fsc-if>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isWorkspace }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;min-width:0;min-height:0;display:flex\">\n  <aside style=\"flex:0 0 300px;min-width:0;border-right:2px solid var(--color-divider);display:flex;flex-direction:column;min-height:0\">\n    <div style=\"display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--color-divider)\">\n      <input class=\"input\" value=\"{{ wsQuery }}\" sc-camel-on-change=\"{{ onWsQuery }}\" placeholder=\"Search\" style=\"flex:1;min-width:0;font-size:13px;padding:7px 10px\">\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ wsNew }}\" title=\"Start a new session\" style=\"padding:7px 10px;font-size:12px\">New session<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow:auto;min-height:0\">\n      <button sc-camel-on-click=\"{{ sesToggle }}\" title=\"{{ sesTip }}\" style=\"width:100%;padding:12px 14px 6px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--color-text)\" style-hover=\"background:var(--color-neutral-200)\"><span style=\"display:inline-block;width:10px;font-size:9px;color:var(--color-neutral-700);transform:rotate({{ sesRot }})\">▼<\u002Fspan>Sessions<span style=\"margin-left:auto;font-weight:400;color:var(--color-neutral-700)\">{{ wsSessCount }}<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ sesOpen }}\">\n      <sc-if value=\"{{ sesMenuOpen }}\"><div sc-camel-on-click=\"{{ sesMenuClose }}\" style=\"position:fixed;inset:0;z-index:50\"><\u002Fdiv><\u002Fsc-if>\n      <sc-for list=\"{{ wsSessions }}\" as=\"x\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click=\"{{ x.onOpen }}\" style=\"position:relative;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;padding:10px 14px;border:0;border-top:1px solid var(--color-neutral-300);border-left:3px solid {{ x.selBd }};background:{{ x.selBg }};cursor:pointer;text-align:left;color:var(--color-text)\" style-hover=\"background:var(--color-neutral-200)\">\n          <span style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:var(--color-neutral-700)\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;font-weight:700;padding:1px 3px;border:1px solid var(--color-text);color:var(--color-text)\">{{ x.abbr }}<\u002Fspan>{{ x.repo }}<span style=\"margin-left:auto\">{{ x.time }}<\u002Fspan><button sc-camel-on-click=\"{{ x.onMenu }}\" title=\"Session options\" aria-label=\"Session options\" style=\"width:22px;height:22px;margin:-3px -6px -3px 0;border:1px solid {{ x.menuBd }};background:transparent;cursor:pointer;color:var(--color-text);font-size:15px;line-height:1;padding:0\" style-hover=\"border-color:var(--color-divider)\">⋮<\u002Fbutton><\u002Fspan>\n          <span style=\"font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ x.title }}<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;font-size:11px;color:var(--color-neutral-700)\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0\">{{ x.branch }}<\u002Fspan><span style=\"width:7px;height:7px;flex:none;background:{{ x.dot }}\"><\u002Fspan>{{ x.state }}<\u002Fspan>\n          <sc-if value=\"{{ x.menuOpen }}\">\n            <div sc-camel-on-click=\"{{ x.stop }}\" style=\"position:absolute;right:8px;top:30px;z-index:51;width:220px;background:var(--color-bg);border:2px solid var(--color-text);box-shadow:var(--shadow-lg);cursor:default\">\n              <sc-if value=\"{{ x.notConfirm }}\"><button sc-camel-on-click=\"{{ x.onAskDelete }}\" style=\"display:block;width:100%;padding:9px 12px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:13px;font-weight:600;color:var(--color-accent-700)\" style-hover=\"background:var(--color-accent-100)\">Delete session<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ x.confirm }}\"><div style=\"padding:10px 12px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:13px;font-weight:800\">Delete this session?<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">Its chat history is removed. Branches and PRs stay as they are.<\u002Fdiv><div style=\"display:flex;gap:6px\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ x.onDelete }}\" style=\"padding:5px 10px;font-size:12px\">Delete<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ x.onCancel }}\" style=\"padding:5px 10px;font-size:12px\">Cancel<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <\u002Fsc-if>\n      <div style=\"padding:16px 14px 6px;font-size:12px;font-weight:800;display:flex;border-top:2px solid var(--color-divider);margin-top:8px\">Open pull requests<span style=\"margin-left:auto;font-weight:400;color:var(--color-neutral-700)\">{{ wsPrCount }}<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ wsPrGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ g.onToggle }}\" aria-expanded=\"{{ g.expanded }}\" title=\"{{ g.tip }}\" style=\"width:100%;padding:8px 14px 6px;font-size:11px;font-weight:700;color:var(--color-neutral-700);display:flex;align-items:center;gap:6px;border:0;border-top:1px solid var(--color-neutral-300);background:transparent;cursor:pointer;text-align:left\" style-hover=\"background:var(--color-neutral-200)\"><span style=\"display:inline-block;width:10px;font-size:9px;transform:rotate({{ g.rot }})\">▼<\u002Fspan>{{ g.label }}<span style=\"margin-left:auto;font-weight:400\">{{ g.count }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ g.open }}\">\n      <sc-for list=\"{{ g.prs }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ p.onOpen }}\" style=\"width:100%;display:flex;flex-direction:column;gap:3px;padding:10px 14px;border:0;border-top:1px solid var(--color-neutral-300);border-left:3px solid {{ p.selBd }};background:{{ p.selBg }};cursor:pointer;text-al y:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--color-divider)\"><input class=\"input\" value=\"{{ wsGit.newName }}\" sc-camel-on-change=\"{{ wsGit.onNewName }}\" sc-camel-on-key-down=\"{{ wsGit.onNewKey }}\" placeholder=\"New branch from current\" style=\"flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;padding:5px 8px\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ wsGit.onCreate }}\" style=\"padding:5px 10px;font-size:12px\">Create<\u002Fbutton><\u002Fdiv>\n                <div style=\"padding:0 12px 8px;font-size:11px;color:var(--color-neutral-700)\">{{ wsGit.note }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n          <span style=\"margin-left:auto;font-size:11px;color:var(--color-neutral-600)\" title=\"Shift+Enter adds a new line\">Enter to send<\u002Fspan>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ wsSend }}\" title=\"Send\" style=\"padding:6px 14px\">Send<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ DEV TOOLS ============ -->\n<sc-if value=\"{{ isDevtools }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{ devSynced }}\">\n<div style=\"flex:1;min-width:0;display:flex;flex-wrap:wrap;overflow:hidden\">\n  <aside style=\"flex:1 1 220px;min-width:200px;max-width:280px;border-right:2px solid var(--color-divider);display:flex;flex-direction:column;overflow:auto\">\n    <div style=\"padding:14px 16px 4px;font-weight:800\">Synced dev tools<\u002Fdiv>\n    <div style=\"padding:0 16px 10px;font-size:11px;color:var(--color-neutral-700)\">Select tools to narrow the search. With none selected, the agent searches every connected dev tool.<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ devAllPick }}\" style=\"display:flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-top:1px solid var(--color-neutral-300);border-left:3px solid {{ devAllBd }};background:{{ devAllBg }};cursor:pointer;text-align:left;color:var(--color-text);font-size:12px;font-weight:700\" style-hover=\"background:var(--color-neutral-200)\">All connected<span style=\"margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:400;color:var(--color-neutral-700)\">{{ devAllCount }}<\u002Fspan><\u002Fbutton>\n    <sc-for list=\"{{ devConns }}\" as=\"c\" hint-placeholder-count=\"10\">\n      <button sc-camel-on-click=\"{{ c.onPick }}\" style=\"display:flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-top:1px solid var(--color-neutral-300);border-left:3px solid {{ c.scopeBd }};background:{{ c.scopeBg }};cursor:pointer;text-align:left;color:var(--color-text)\" style-hover=\"background:var(--color-neutral-200)\">\n        <span style=\"width:8px;height:8px;flex:none;background:{{ c.markBg }};border:1.5px solid {{ c.markBd }}\"><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;padding:0 3px;border:1px solid var(--color-text);width:30px;text-align:center\">{{ c.abbr }}<\u002Fspan>\n        <span style=\"flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.name }}<\u002Fspan>\n        <sc-if value=\"{{ c.prod }}\"><span style=\"font-size:9px;font-weight:800;padding:1px 4px;background:var(--color-accent);color:var(--color-bg)\">PROD<\u002Fspan><\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Faside>\n  <section class=\"term\" style=\"flex:999 1 520px;min-width:0;display:flex;flex-direction:column;background:var(--color-neutral-900);min-height:480px\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--color-neutral-700);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--color-neutral-400)\">\n      <span style=\"width:7px;height:7px;background:var(--color-neutral-300)\"><\u002Fspan>\n      <span style=\"flex:1\">ops-agent · dev tools · {{ devHost }} · scope: <span style=\"color:var(--color-neutral-100)\">{{ devScopeLabel }}<\u002Fspan><\u002Fspan>\n      <span>local terminal<\u002Fspan>\n    <\u002Fdiv>\n    <div ref=\"{{ devRef }}\" style=\"flex:1;overflow:auto;padding:12px 16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.7\">\n      <sc-for list=\"{{ devLines }}\" as=\"tl\" hint-placeholder-count=\"8\">\n        <div style=\"white-space:pre;color:{{ tl.color }};font-weight:{{ tl.weight }}\">{{ tl.t }}<\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:8px;color:var(--color-neutral-100)\">\n        <span style=\"color:var(--color-accent-400)\">&gt;<\u002Fspan>\n        <input value=\"{{ devInput }}\" sc-camel-on-change=\"{{ onDevInput }}\" sc-camel-on-key-down=\"{{ onDevKey }}\" placeholder=\"Ask the agent — e.g. find shop glowbar · show 5 pending reservations\" style=\"flex:1;background:transparent;border:0;outline:none;color:var(--color-neutral-100);font-family:inherit;font-size:12px;caret-color:var(--color-accent-400)\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fmain>\n\n<!-- ============ SETTINGS DRAWER ============ -->\n<sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeSettings }}\" style=\"position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--color-neutral-900) 35%,transparent)\"><\u002Fdiv>\n  <aside style=\"position:fixed;top:0;right:0;bottom:0;width:600px;max-width:100vw;z-index:41;background:var(--color-bg);border-left:2px solid var(--color-text);box-shadow:var(--shadow-lg);display:flex;flex-direction:column\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:2px solid var(--color-divider)\">\n      <sc-if value=\"{{ inSetup }}\"><button class=\"btn btn-icon\" sc-camel-on-click=\"{{ backSetup }}\" title=\"Back\" style=\"width:30px;height:30px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n      <h4 style=\"margin:0\">{{ drawerTitle }}<\u002Fh4>\n      <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ closeSettings }}\" title=\"Close\" style=\"margin-left:auto;width:30px;height:30px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ notSetup }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);border-bottom:2px solid var(--color-divider)\">\n        <sc-for list=\"{{ sTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border:0;border-right:1px solid var(--color-divider);border-bottom:3px solid {{ t.bd }};margin-bottom:-2px;background:transparent;cursor:pointer;text-align:left;color:var(--color-text)\" style-hover=\"background:var(--color-neutral-200)\">\n            <span style=\"font-size:13px;font-weight:{{ t.weight }}\">{{ t.label }}<\u002Fspan>\n            <span style=\"font-size:11px;color:{{ t.subColor }}\">{{ t.sub }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"flex:1;overflow:auto\">\n\n      <!-- Agents -->\n      <sc-if value=\"{{ tabAgents }}\">\n        <sc-if value=\"{{ noAccounts }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:32px 20px\">\n            <div style=\"font-weight:800\">No Claude account yet<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--color-neutral-700)\">Add a Claude account to run agents. Signing in opens Anthropic in your browser. The usage and session settings appear once an account is signed in.<\u002Fdiv>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ addAccount }}\">+ Add Claude account<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasAccounts }}\">\n        <sc-if value=\"{{ noneSignedIn }}\">\n          <div style=\"padding:16px 20px;background:var(--color-accent-100);color:var(--color-accent-900);border-bottom:1px solid var(--color-divider)\">\n            <div style=\"font-weight:800\">Sign in to a Claude account<\u002Fdiv>\n            <div style=\"font-size:12px\">The agent runs under a Claude account. Sign in below; the settings appear once one account is signed in.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasSignedIn }}\">\n        <div style=\"padding:16px 20px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--color-divider)\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <div style=\"flex:1\"><div style=\"font-weight:800\">Auto-switch accounts<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">When the active account reaches {{ threshold }}% of its usage window, the session moves to the next account with headroom. Context carries over.<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleAuto }}\" style=\"width:44px;height:24px;border:1.5px solid var(--color-text);background:{{ autoBg }};cursor:pointer;padding:0;display:flex;justify-content:{{ autoJustify }}\"><span style=\"width:18px;height:18px;margin:1.5px;background:{{ autoKnob }}\"><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--color-neutral-300)\">\n            <div style=\"flex:1\"><div style=\"font-weight:800\">Smart usage<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">Uses the account whose weekly quota would otherwise go unused first: weekly % left ÷ days until weekly reset. Accounts with a full 5-hour window are skipped.<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleSmart }}\" style=\"width:44px;height:24px;border:1.5px solid var(--color-text);background:{{ smartBg }};cursor:pointer;padding:0;display:flex;justify-content:{{ smartJustify }}\"><span style=\"width:18px;height:18px;margin:1.5px;background:{{ smartKnob }}\"><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ smartBanner }}\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--color-accent-100);color:var(--color-accent-900);font-size:12px\">\n              <span style=\"flex:1\"><strong style=\"font-family:'JetBrains Mono',ui-monospace,monospace\">{{ smartPickId }}<\u002Fstrong> is the smart pick: {{ smartReason }} It is used automatically; turn Smart usage off to stop that.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding:16px 20px 4px;font-weight:800\">Defaults for new sessions<\u002Fdiv>\n        <div style=\"padding:0 20px 8px;font-size:12px;color:var(--color-neutral-700)\">Every new Workspace session starts with these. You can still change them per session from the composer.<\u002Fdiv>\n        <sc-if value=\"{{ ddOpen }}\"><div sc-camel-on-click=\"{{ ddClose }}\" style=\"position:fixed;inset:0;z-index:50\"><\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{ defDd }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--color-neutral-300)\">\n            <div style=\"flex:1;min-width:0\"><div style=\"font-weight:700;font-size:14px\">{{ c.label }}<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ c.desc }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"position:relative\">\n              <button sc-camel-on-click=\"{{ c.onToggle }}\" style=\"display:flex;align-items:center;gap:8px;min-width:190px;padding:7px 10px;border:1.5px solid var(--color-text);background:var(--color-bg);cursor:pointer;font-size:13px;color:var(--color-text);text-align:left\"><span style=\"flex:1\">{{ c.value }}<\u002Fspan><span style=\"font-size:9px\">▼<\u002Fspan><\u002Fbutton>\n              <sc-if value=\"{{ c.open }}\"><div style=\"position:absolute;right:0;top:calc(100% + 4px);z-index:51;width:270px;max-height:320px;overflow:auto;background:var(--color-bg);border:2px solid var(--color-text);box-shadow:var(--shadow-lg)\"><sc-for list=\"{{ c.options }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.onPick }}\" style=\"display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 12px;border:0;border-left:3px solid {{ o.bd }};background:{{ o.bg }};cursor:pointer;text-align:left;color:var(--color-text)\" style-hover=\"background:var(--color-neutral-200)\"><span style=\"flex:1;min-width:0\"><span style=\"display:block;font-size:13px;font-weight:{{ o.weight }}\">{{ o.label }}<\u002Fspan><span style=\"display:block;font-size:11px;color:var(--color-neutral-700)\">{{ o.sub }}<\u002Fspan><\u002Fspan><span style=\"font-size:10px;color:var(--color-neutral-700);white-space:nowrap\">{{ o.tag }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fsc-if>\n        <div style=\"padding:16px 20px 6px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);border-top:2px solid var(--color-divider);margin-top:8px\">Claude Code accounts<\u002Fdiv>\n<sc-for list=\"{{ accounts }}\" as=\"a\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--color-divider);background:{{ a.bg }}\">\n            <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--color-neutral-700)\">{{ a.order }}<\u002Fspan>\n            <div style=\"min-width:0;display:flex;flex-direction:column;gap:5px\">\n              <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><strong style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px\">{{ a.email }}<\u002Fstrong><sc-if value=\"{{ a.showPlan }}\"><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ a.plan }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ a.isActive }}\"><span style=\"font-size:10px;font-weight:800;padding:1px 6px;background:var(--color-text);color:var(--color-bg)\">ACTIVE<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ a.isPick }}\"><span style=\"font-size:10px;font-weight:800;padding:1px 6px;border:1.5px solid var(--color-accent);color:var(--color-accent-700)\">SMART PICK<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n              <sc-if value=\"{{ a.signedIn }}\">\n                <div style=\"display:grid;grid-template-columns:48px minmax(0,1fr) 160px;gap:10px;align-items:center\"><span style=\"font-size:11px;color:var(--color-neutral-700)\">5-hour<\u002Fspan><span style=\"height:6px;background:var(--color-neutral-300);display:block\"><span style=\"display:block;height:6px;width:{{ a.w }};background:{{ a.bar }}\"><\u002Fspan><\u002Fspan><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:{{ a.pctColor }}\">{{ a.used }}% · resets {{ a.reset }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:48px minmax(0,1fr) 160px;gap:10px;align-items:center\"><span style=\"font-size:11px;color:var(--color-neutral-700)\">Weekly<\u002Fspan><span style=\"height:6px;background:var(--color-neutral-300);display:block\"><span style=\"display:block;height:6px;width:{{ a.ww }};background:{{ a.wbar }}\"><\u002Fspan><\u002Fspan><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--color-neutral-800)\">{{ a.weekText }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ a.smartNote }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.notSignedIn }}\"><div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ a.statusText }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px\">\n              <sc-if value=\"{{ a.canUse }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ a.onUse }}\" style=\"padding:4px 10px;font-size:12px\">Use<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ a.showSignIn }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ a.onSignIn }}\" style=\"padding:4px 10px;font-size:12px\">Sign in<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ a.showRelogin }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ a.onSignIn }}\" style=\"padding:4px 10px;font-size:12px\">Re-login<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ a.showLogout }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ a.onLogout }}\" style=\"padding:4px 10px;font-size:12px\">Log out<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ a.showCancel }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ a.onCancel }}\" style=\"padding:4px 10px;font-size:12px\">Cancel<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ a.showTrash }}\"><button class=\"btn btn-icon\" sc-camel-on-click=\"{{ a.onRemove }}\" title=\"Remove account\" style=\"width:28px;height:28px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"padding:12px 20px;border-top:1px solid var(--color-divider)\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ addAccount }}\">+ Add Claude account<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- MCP -->\n      <sc-if value=\"{{ tabMcp }}\">\n        <div style=\"padding:14px 20px;font-size:12px;color:var(--color-neutral-700);border-bottom:1px solid var(--color-divider);display:flex;gap:10px;align-items:center\">\n          <span style=\"flex:1\">Read from <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace\">claude mcp list<\u002Fspan> · ~/.claude.json and project .mcp.json<\u002Fspan>\n        <\u002Fdiv>\n          <sc-for list=\"{{ mcpList }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ m.onOpen }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 170px 64px auto;gap:12px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--color-neutral-300);cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">\n              <div style=\"min-width:0\">\n                <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;font-weight:600\">{{ m.id }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:{{ m.subColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ m.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:{{ m.glyphColor }}\">{{ m.glyph }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--color-neutral-700)\">{{ m.tools }}<\u002Fspan>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ m.onAction }}\" style=\"padding:3px 10px;font-size:12px;min-width:104px;justify-content:flex-start\">{{ m.action }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <div style=\"display:flex;gap:8px;align-items:center;padding:14px 20px;font-size:12px;color:var(--color-neutral-700)\">{{ dbMcpNote }}<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ openDevTab }}\" style=\"font-size:12px\">Open Dev tools →<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Repos -->\n      <sc-if value=\"{{ tabRepos }}\">\n        <div style=\"padding:16px 20px;display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--color-divider)\">\n          <div style=\"font-weight:800\">Import a local repo<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-700)\">Enter the path of a git repo from any folder on this machine. It shows up in the Workspace when you start a session.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <input class=\"input\" value=\"{{ repoPath }}\" sc-camel-on-change=\"{{ onRepoPath }}\" sc-camel-on-key-down=\"{{ onRepoPathKey }}\" placeholder=\"/path/to/repo, e.g. ~/code/my-app\" style=\"flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ importRepo }}\">Import<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;font-size:12px;color:var(--color-neutral-700)\"><span style=\"flex:1\">{{ repoMsg }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n\n        <div style=\"display:flex;align-items:center;padding:14px 20px 8px\"><span style=\"font-weight:800;flex:1\">Imported repos<\u002Fspan><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ repoCountLabel }}<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ repoList }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:9px 20px;border-top:1px solid var(--color-neutral-300)\">\n            <div style=\"flex:1;min-width:0\"><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;font-weight:600\">{{ r.name }}<\u002Fdiv><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--color-neutral-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.path }} · {{ r.branch }}<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:10px;font-weight:600;padding:0 5px;border:1px solid var(--color-divider)\">{{ r.host }}<\u002Fspan>\n            <sc-if value=\"{{ r.notConfirm }}\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ r.onAsk }}\" style=\"font-size:12px;color:var(--color-accent-700)\">Remove<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ r.confirm }}\"><span style=\"font-size:12px\">Remove from the list?<\u002Fspan><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ r.onRemove }}\" style=\"padding:4px 10px;font-size:12px\">Remove<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ r.onCancel }}\" style=\"padding:4px 10px;font-size:12px\">Cancel<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ repoNone }}\"><div style=\"padding:10px 20px;font-size:12px;color:var(--color-neutral-700)\">No repos yet. Import one above.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- MCP detail -->\n      <sc-if value=\"{{ showMcpD }}\">\n        <div style=\"padding:14px 20px 6px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);border-bottom:1px solid var(--color-neutral-300)\">Details · read-only<\u002Fdiv>\n        <sc-for list=\"{{ mcpD.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:9px 20px;border-bottom:1px solid var(--color-neutral-300);font-size:13px\">\n            <span style=\"color:var(--color-neutral-700)\">{{ r.k }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;word-break:break-all\">{{ r.v }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"padding:14px 20px 6px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Tools<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 16px;border-bottom:2px solid var(--color-divider)\">\n          <sc-for list=\"{{ mcpD.tools }}\" as=\"t\" hint-placeholder-count=\"5\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:2px 8px;border:1px solid var(--color-divider)\">{{ t }}<\u002Fspan><\u002Fsc-for>\n          <sc-if value=\"{{ mcpD.noTools }}\"><span style=\"font-size:12px;color:var(--color-neutral-700)\">Tools are listed once the server is connected.<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Connectors -->\n      <sc-if value=\"{{ tabConnectors }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr))\">\n          <sc-for list=\"{{ connectors }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:flex;flex-direction:column;gap:6px;padding:16px 20px;border:0;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);background:transparent;cursor:pointer;text-align:left;color:var(--color-text);min-height:110px\" style-hover=\"background:var(--color-neutral-200)\">\n              <div style=\"display:flex;align-items:center;gap:8px;width:100%\"><strong style=\"font-size:15px\">{{ c.name }}<\u002Fstrong><span style=\"margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:{{ c.stColor }}\"><span style=\"width:8px;height:8px;background:{{ c.markBg }};border:1.5px solid {{ c.markBd }}\"><\u002Fspan>{{ c.stLabel }}<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ c.via }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px\">{{ c.account }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Dev tool connections -->\n      <sc-if value=\"{{ tabDev }}\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:{{ devTermBd }}\">\n          <div style=\"flex:1\"><div style=\"font-weight:800\">Add with Claude<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">Open a Claude terminal and paste the raw details: a connection string, or host, port, database, user and password. Claude works out the type, tests the connection, stores the secret on this machine and adds it to the list below.<\u002Fdiv><\u002Fdiv>\n          <button class=\"btn {{ devTermBtnCls }}\" sc-camel-on-click=\"{{ toggleDevTerm }}\" style=\"flex:none;display:flex;align-items:center;gap:6px\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 17l6-5-6-5M12 19h8\"><\u002Fpath><\u002Fsvg>{{ devTermLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ devTermOpen }}\">\n          <div class=\"term\" style=\"background:var(--color-neutral-900);border-bottom:2px solid var(--color-divider)\">\n            <div ref=\"{{ setupRef }}\" style=\"max-height:300px;min-height:180px;overflow:auto;padding:12px 16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.7\">\n              <sc-for list=\"{{ setupLines }}\" as=\"l\" hint-placeholder-count=\"3\"><div style=\"white-space:pre-wrap;word-break:break-word;color:{{ l.color }};font-weight:{{ l.weight }}\">{{ l.t }}<\u002Fdiv><\u002Fsc-for>\n              <div style=\"display:flex;gap:8px\"><span style=\"color:var(--color-accent-400)\">&gt;<\u002Fspan><input value=\"{{ setupInput }}\" sc-camel-on-change=\"{{ onSetupInput }}\" sc-camel-on-key-down=\"{{ onSetupKey }}\" placeholder=\"e.g. mongodb+srv://user:pass@cluster0.example.net/orders read only\" style=\"flex:1;background:transparent;border:0;outline:none;color:var(--color-neutral-100);font-family:inherit;font-size:12px;caret-color:var(--color-accent-400)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 12px;border-top:1px solid var(--color-neutral-700)\">\n              <span style=\"font-size:11px;color:var(--color-neutral-400);align-self:center\">Try:<\u002Fspan>\n              <sc-for list=\"{{ devExamples }}\" as=\"x\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ x.onClick }}\" style=\"border:1px solid var(--color-neutral-600);background:transparent;padding:3px 8px;cursor:pointer;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--color-neutral-200)\" style-hover=\"border-color:var(--color-neutral-300)\">{{ x.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"padding:14px 20px;font-size:12px;color:var(--color-neutral-700);border-bottom:1px solid var(--color-divider);display:flex;gap:10px;align-items:center\">\n          <span style=\"flex:1\">Databases and streams Claude can use. Claude gets the access level you set per connection.<\u002Fspan>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ addConn }}\" style=\"padding:5px 12px;font-size:12px\">+ Add connection<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-for list=\"{{ conns }}\" as=\"c\" hint-placeholder-count=\"10\">\n          <button sc-camel-on-click=\"{{ c.onEdit }}\" style=\"width:100%;display:grid;grid-template-columns:12px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 20px;border:0;border-bottom:1px solid var(--color-neutral-300);background:transparent;cursor:pointer;text-align:left;color:var(--color-text)\" style-hover=\"background:var(--color-neutral-200)\">\n            <span style=\"width:9px;height:9px;background:{{ c.markBg }};border:1.5px solid {{ c.markBd }}\"><\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;padding:0 3px;border:1px solid var(--color-text);text-align:center\">{{ c.abbr }}<\u002Fspan>\n            <div style=\"min-width:0\"><div style=\"display:flex;gap:6px;align-items:center\"><span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:600\">{{ c.name }}<\u002Fspan><sc-if value=\"{{ c.prod }}\"><span style=\"font-size:9px;font-weight:800;padding:1px 4px;background:var(--color-accent);color:var(--color-bg)\">PROD<\u002Fspan><\u002Fsc-if><\u002Fdiv><div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ c.type }} · {{ c.host }}<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:11px;color:var(--color-neutral-800)\">Claude: {{ c.access }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n\n      <!-- Setup: type picker -->\n      <sc-if value=\"{{ pickType }}\">\n        <div style=\"padding:16px 20px 8px;font-size:13px;color:var(--color-neutral-700)\">Choose what to connect.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--color-divider)\">\n          <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex;flex-direction:column;gap:6px;padding:16px;border:0;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);background:transparent;cursor:pointer;text-align:left;color:var(--color-text);min-height:96px\" style-hover=\"background:var(--color-neutral-200)\">\n              <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;padding:1px 4px;border:1px solid var(--color-text);align-self:flex-start\">
