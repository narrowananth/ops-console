name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    # GitHub's macOS runner of the build's own architecture.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Chrome DevTools frontend, kept per pin
        uses: actions/cache@v5
        with:
          path: frontend/public/devtools-frontend
          key: devtools-frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/devtools-frontend.json') }}
      - name: Package
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: node scripts/package.mjs "${GITHUB_REF_NAME#v}"
      - name: Install the built tarball and run it under launchd
        run: |
          set -eu
          mkdir release
          cp "out/ops-console-darwin-${{ matrix.arch }}.tar.gz" release/
          (cd release && shasum -a 256 ops-console-darwin-*.tar.gz > checksums.txt)
          OPS_CONSOLE_RELEASE_URL="file://$PWD/release" sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          test "$(ops-console --version)" = "${GITHUB_REF_NAME#v}"
          ops-console start
          ops-console status
          ops-console open
          ops-console stop
          code=0; ops-console status || code=$?
          test "$code" = 3
      - name: Daemon log
        if: failure()
        run: cat "$HOME/Library/Logs/ops-console/daemon.log" || true
      - uses: actions/upload-artifact@v6
        with:
          name: ops-console-darwin-${{ matrix.arch }}
          path: out/ops-console-darwin-${{ matrix.arch }}.tar.gz

  # Linux ships after the spike's results are approved (docs/specs/linux-port.md, Release order): these jobs build and
  # test the tarballs and keep them as artifacts. `publish` and `tap` do not take them.
  build-linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # A runner of the build's own architecture, so `npm install` compiles node-pty for it, on glibc 2.35: the oldest
    # `install.sh` accepts, so what loads here loads on every system it admits.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Chrome DevTools frontend, kept per pin
        uses: actions/cache@v5
        with:
          path: frontend/public/devtools-frontend
          key: devtools-frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/devtools-frontend.json') }}
      - name: Package
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: node scripts/package.mjs "${GITHUB_REF_NAME#v}"
      # The runner's systemd user manager needs a login session: lingering starts it, and the bus lives under
      # XDG_RUNTIME_DIR.
      - name: Start a systemd user manager
        run: |
          set -eu
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1 && exit 0
            sleep 1
          done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment
      - name: Install the built tarball and run it under systemd
        run: |
          set -eu
          mkdir release
          cp "out/ops-console-linux-${{ matrix.arch }}.tar.gz" release/
          (cd release && sha256sum ops-console-linux-*.tar.gz > checksums.txt)
          OPS_CONSOLE_RELEASE_URL="file://$PWD/release" sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          test "$(ops-console --version)" = "${GITHUB_REF_NAME#v}"
          ops-console start
          ops-console status
          # No DISPLAY here: open prints the address and exits 0.
          ops-console open
          # The compiled node-pty the tarball carries loads, so terminals open.
          (cd "$HOME/.ops-console/current/app" && "$HOME/.ops-console/current/node/bin/node" -e "require('node-pty')")
          ops-console stop
          code=0; ops-console status || code=$?
          test "$code" = 3
      - name: Daemon log
        if: failure()
        run: |
          cat "${XDG_STATE_HOME:-$HOME/.local/state}/ops-console/daemon.log" || true
          systemctl --user status ops-console.service || true
      - uses: actions/upload-artifact@v6
        with:
          name: ops-console-linux-${{ matrix.arch }}
          path: out/ops-console-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
          pattern: ops-console-darwin-*
      # macOS only for now: the Linux tarballs are not downloaded here, so checksums.txt cannot name them.
      - name: Attach tarballs and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum ops-console-darwin-*.tar.gz > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            ops-console-darwin-arm64.tar.gz ops-console-darwin-x64.tar.gz checksums.txt

  # A failure here leaves the published release as it is; rerun the job.
  tap:
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          node scripts/homebrew/render.mjs "${GITHUB_REF_NAME#v}" checksums.txt > ops-console.rb
      - name: Check the formula from a local tap before it reaches main
        run: |
          set -eu
          brew tap-new --no-git local/ops-console
          tap="$(brew --repository local/ops-console)"
          cp ops-console.rb "$tap/Formula/ops-console.rb"
          brew trust local/ops-console
          brew style local/ops-console/ops-console
          brew audit --strict --formula local/ops-console/ops-console
          brew install local/ops-console/ops-console
          brew test local/ops-console/ops-console
      - uses: actions/checkout@v6
        with:
          ref: main
          path: main
      - name: Commit the formula to main
        run: |
          set -eu
          mkdir -p main/Formula
          cp ops-console.rb main/Formula/ops-console.rb
          cd main
          git add Formula/ops-console.rb
          if git diff --cached --quiet; then
            echo "Formula/ops-console.rb already holds ${GITHUB_REF_NAME}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Chore: ops-console formula ${GITHUB_REF_NAME#v}"
          git pull --rebase origin main
          git push origin HEAD:main
