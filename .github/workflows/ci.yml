name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A run again by hand, from the Actions tab or `gh workflow run ci.yml`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # macOS, as the app is: the sandbox, Keychain and launchd tests need it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ops-console/frontend exec playwright install chromium
      - run: pnpm check
