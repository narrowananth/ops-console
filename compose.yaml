name: ops-console

# Ports sit away from 5432 and 6379, which other local projects already use.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ops_console
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ops", "-d", "ops_console"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
