<text x="142" y="511" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="540" r="9" fill="#2d3142"/>
<text x="84" y="543.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="544" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Add in this browser (a tab opens, 5 min) or by sign-in link: open it, paste the code or page address Anthropic shows. A link works for one sign-in and stops after 15 min. A rejected code gets a new link. One</text>
<text x="108" y="560" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">email is added once (409).</text>
<circle cx="84" cy="584" r="9" fill="#2d3142"/>
<text x="84" y="587.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="588" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Sign-in runs in Anthropic&#x27;s own flow. The console never reads a Claude token and never uses the operator&#x27;s own Claude Code login. Cancelling removes a new account.</text>
<circle cx="84" cy="612" r="9" fill="#2d3142"/>
<text x="84" y="615.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="616" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Each account has its own CLAUDE_CONFIG_DIR under the data folder. The first account to sign in becomes active. Remove copies each Session&#x27;s transcript to the target account first. Log out and Remove are</text>
<text x="108" y="632" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">refused while a run on that account goes.</text>
<circle cx="84" cy="656" r="9" fill="#2d3142"/>
<text x="84" y="659.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="660" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Usage is read per signed-in account from the SDK&#x27;s rate-limit events and a usage request. A failing read keeps the last values. The 5-hour bar turns accent from 90 %, the weekly bar from 80 %.</text>
<circle cx="84" cy="684" r="9" fill="#2d3142"/>
<text x="84" y="687.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="688" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Smart usage moves to the top pick (weekly % left divided by days to reset) on every read, and can undo a manual Use. With it off, Auto-switch moves at a 5-hour threshold (50 to 100 %, default 95).</text>
<text x="108" y="704" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Anthropic&#x27;s terms may read this as getting around usage limits; the operator accepted that risk and both can be turned off.</text>
<circle cx="84" cy="728" r="9" fill="#2d3142"/>
<text x="84" y="731.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="732" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A limit rejection resumes once on a new account (rate_limited) or the Session fails. An auth failure signs the account out, moves on (sign_in_failed), resumes once, else the Session fails unauthorized.</text>
<circle cx="84" cy="756" r="9" fill="#2d3142"/>
<text x="84" y="759.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text>
<text x="108" y="760" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CLIProxy can be turned on only while Connected. With it on, runs send its API key and address, usage is not read, and Auto-switch and Smart usage pause. The address must be loopback (ADR 0003).</text>
<circle cx="84" cy="784" r="9" fill="#2d3142"/>
<text x="84" y="787.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">8</text>
<text x="108" y="788" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Switch reasons recorded: manual, auto, smart, rate_limited, sign_in_failed. Each switch sends account.switched and the sidebar account card follows it.</text>
