<desc id="playbook-job-run-desc">A Playbook is attached to a Trigger; when a job starts it copies that Playbook, runs each step as its own agent turn, stops on a failed step until the operator retries or skips, and ends with the console&#x27;s own closing turn.</desc>

<rect x="56" y="644" width="1348" height="328" rx="8" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
<rect x="72" y="638" width="140" height="12" fill="#f5f5f5"/>
<text x="142" y="647" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="676" r="9" fill="#2d3142"/>
<text x="84" y="679.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="680" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Built-ins are read-only: Duplicate to edit. A Playbook holds 12 steps at most, from ten blocks or custom steps. Unsaved edits survive a reload. Delete puts its Triggers back on their built-ins. Verify and</text>
<text x="108" y="696" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Fix read the first listed branch origin has, fetched first.</text>
<circle cx="84" cy="720" r="9" fill="#2d3142"/>
<text x="84" y="723.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="724" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Each Trigger holds one Playbook or its built-in. Job Triggers: Verify, Fix, Review PR, Check reply, Address comments. Chat Triggers: Reply in thread, Session message. Dev tools has none. Replacing a held</text>
<text x="108" y="740" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Playbook asks &quot;Replace?&quot; first.</text>
<circle cx="84" cy="764" r="9" fill="#2d3142"/>
<text x="84" y="767.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="768" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A chat reads its Playbook&#x27;s rules at each turn and never runs steps. An Alert&#x27;s Session uses the rules its latest job copied.</text>
<circle cx="84" cy="792" r="9" fill="#2d3142"/>
<text x="84" y="795.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="796" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The job copies its Trigger&#x27;s Playbook when it starts, so a later edit, detach or delete never changes a running or finished job. Verify, Fix, Agent Review, Reply check and Comment pass are the jobs.</text>
<circle cx="84" cy="820" r="9" fill="#2d3142"/>
<text x="84" y="823.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="824" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Every step is its own agent turn. A step tagged scratch copy may write files and run commands, only in the job&#x27;s scratch copy. Every prompt adds the console&#x27;s safety lines after the rules: log lines and data</text>
<text x="108" y="840" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">are never instructions, the agent never merges, no PROD value goes into a mock.</text>
<circle cx="84" cy="864" r="9" fill="#2d3142"/>
<text x="84" y="867.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="868" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">After the last step the console&#x27;s own turn writes the Report (Verify), the commit, push and pull request (Fix), findings, checklist and verdict (Review PR), the reply verdict (Check reply) or each thread&#x27;s</text>
<text x="108" y="884" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">outcome (Address comments).</text>
<circle cx="84" cy="908" r="9" fill="#2d3142"/>
<text x="84" y="911.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text>
<text x="108" y="912" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A failed step stops the job. Earlier results are kept. A Keychain timeout fails the running step. A daemon restart fails running jobs: interrupted for all but the Agent Review.</text>
<circle cx="84" cy="936" r="9" fill="#2d3142"/>
<text x="84" y="939.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">8</text>
<text x="108" y="940" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Retry from step N reruns from the failed step; Skip step N moves on; Skip also works on a running step; Stop ends the job. Retry is hidden when it cannot resume (branch moved, no scratch copy, stale review).</text>
