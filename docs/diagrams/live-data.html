<text x="1300" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Jira · Slack · DBs</text>
<text x="1300" y="419" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">agent and fixed reads</text>
<text x="68" y="456" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Instrument Serif', serif" text-anchor="start" font-style="italic">UI turns each event into query</text>
<text x="68" y="474" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Instrument Serif', serif" text-anchor="start" font-style="italic">refetches, batched over 40 ms.</text>
<text x="78" y="590" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">An unauthorized reply drops the token and signs the UI out. Any number of browsers on the Mac work at once, each with its own Remembered view.</text>
<text x="78" y="616" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Events are sent only after the transaction commits, so a refetch never reads half a write. Pull requests and Session messages stay off state.db.</text>
<text x="78" y="642" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">/ws sends events only, never commands. Events cover settings, Sessions, Approvals, Action Log, accounts, Connectors, Keychain waits, Workspace and Monitor.</text>
<text x="78" y="668" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A list over 60 s (detail over 15 s) is served at once while a background read runs. A failed read keeps the old list and marks it stale. Refresh drops it.</text>
<text x="78" y="694" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">monitor-scan: 6 h grid from the daily scan time. monitor-pr-watch: every 5 min and after each list refresh. A missed slot runs once at start.</text>
<text x="78" y="720" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Before the port opens: working, waiting_input and waiting_approval Sessions fail, Approvals expire, running Scans, Fixes and jobs fail as interrupted.</text>
<text x="78" y="746" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">429 or a rate-limit message becomes rate_limited and the UI shows stale data. Merge is a button for the operator only.</text>
<text x="78" y="772" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Keychain calls are bound at 60 s and fail keychain_timeout. A late answer is dropped, and a late set may still land.</text>
<text x="78" y="798" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Claude accounts hold their own CLAUDE_CONFIG_DIR. With CLIProxy on, usage is not read and switching is off. Smart usage moves work to the best account.</text>
