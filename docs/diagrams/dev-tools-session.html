<text x="142" y="647" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="676" r="9" fill="#2d3142"/>
<text x="84" y="679.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="680" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Types: ClickHouse, Firebase, Kafka, MongoDB, Postgres, Redis. Environment is local, dev, staging or prod. Test runs for 30 s and saves nothing. The name is also the MCP server name Claude sees; a duplicate</text>
<text x="108" y="696" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">returns 409.</text>
<circle cx="84" cy="720" r="9" fill="#2d3142"/>
<text x="84" y="723.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="724" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The secret goes to the login Keychain; the edit form shows &quot;stored in the Keychain&quot; and a blank field keeps it. Delete removes the Keychain entry, the row and the MCP server. Rename or an access change</text>
<text x="108" y="740" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">re-registers it.</text>
<circle cx="84" cy="764" r="9" fill="#2d3142"/>
<text x="84" y="767.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="768" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Access Level changes how the server launches, not only the badge. Redis and Kafka have no read-only server. Kafka allows no access above none. A PROD environment is never Read / write: the daemon refuses it</text>
<text x="108" y="784" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">(validation_failed).</text>
<circle cx="84" cy="808" r="9" fill="#2d3142"/>
<text x="84" y="811.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="812" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A Connection at Access none is greyed and out of scope. A live Session&#x27;s scope applies from its next run. The scope narrows, and a question that names no Connection fans out to every one in scope.</text>
<circle cx="84" cy="836" r="9" fill="#2d3142"/>
<text x="84" y="839.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="840" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The first question creates the devtools Session with the draft&#x27;s scope and settings; later ones message it. Two terminals run side by side, each with its own scope. Dev tools uses no Playbook rules.</text>
<circle cx="84" cy="864" r="9" fill="#2d3142"/>
<text x="84" y="867.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="868" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A Connection that is down, needs a login, or is read-only for a write is skipped with a step line. The closing line reads &quot;&lt;rows&gt; rows across &lt;answered&gt; of &lt;queried&gt; Connections&quot;.</text>
<circle cx="84" cy="892" r="9" fill="#2d3142"/>
<text x="84" y="895.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text>
<text x="108" y="896" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The PreToolUse hook runs in every Access mode. Every query writes its Action Log row before it runs.</text>
<circle cx="84" cy="920" r="9" fill="#2d3142"/>
<text x="84" y="923.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">8</text>
<text x="108" y="924" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A PROD Connection with write access asks for an Approval on every write, even in Full access. A read-level server refuses the write itself and logs it failed. A denied Approval is logged denied and the agent</text>
<text x="108" y="940" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">is told.</text>
<circle cx="84" cy="964" r="9" fill="#2d3142"/>
<text x="84" y="967.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">9</text>
<text x="108" y="968" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A Result shows at most 50 rows and 200 characters per cell. A Comparison needs two or more Connections and marks differing fields. Anything the console cannot parse shows as a code block. There is no manual</text>
<text x="108" y="984" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">query path.</text>
