<text x="142" y="511" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="540" r="9" fill="#2d3142"/>
<text x="84" y="543.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="544" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The page is hidden when the daemon is not macOS. It shows Full Disk Access, Start at login and Keychain, then the Run sandbox and Network allowlist for agent runs.</text>
<circle cx="84" cy="568" r="9" fill="#2d3142"/>
<text x="84" y="571.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="572" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Decided by opening ~/Library/Application Support/com.apple.TCC/TCC.db: EPERM or EACCES reads off. Fix: Open System Settings, drag the app in, switch it on, then ops-console stop and start. Check again also</text>
<text x="108" y="588" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">runs on window focus.</text>
<circle cx="84" cy="612" r="9" fill="#2d3142"/>
<text x="84" y="615.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="616" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Without Full Disk Access the installed app locks the start button and tiles with &quot;Needs Full Disk Access · Permissions&quot;. A dev build is never locked.</text>
<circle cx="84" cy="640" r="9" fill="#2d3142"/>
<text x="84" y="643.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="644" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">On means the LaunchAgent plist exists and launchctl print-disabled does not list it. ops-console stop disables it until the next start.</text>
<circle cx="84" cy="668" r="9" fill="#2d3142"/>
<text x="84" y="671.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="672" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The console writes terminals/&lt;id&gt; with the dev-tools-setup agent and an mcp.json (0600), trusts the folder in the active account, and starts claude with --strict-mcp-config, only the setup tools allowed, no</text>
<text x="108" y="688" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">built-in tools, no slash commands. It is not sandboxed (ADR 0006). Close kills the pty, rejects pending secrets and removes the folder; what it added stays.</text>
<circle cx="84" cy="712" r="9" fill="#2d3142"/>
<text x="84" y="715.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="716" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">test_connection (one read, stores nothing), save_connection (a PROD write is refused), connect_connector, authenticate_mcp_server, add_mcp_server (remote http or sse only), request_secret, read_local_file,</text>
<text x="108" y="732" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">list_local_folder, fetch_url and Keychain reads. It cannot change or delete an existing Connection.</text>
<circle cx="84" cy="756" r="9" fill="#2d3142"/>
<text x="84" y="759.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text>
<text x="108" y="760" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The agent asks in a password field and receives only a placeholder; the daemon masks secrets in the stream. The message box refuses control characters, a first / ! or #, and @ paths. The terminal survives</text>
<text x="108" y="776" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">leaving the page and replays its last 64 KB on return.</text>

<text x="108" y="804" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Each get, set or delete waits at most 60 s and then fails keychain_timeout; a handover wait is 90 s. macOS asking shows &quot;asks each time&quot; or &quot;waiting since&quot;. A timeout fails the running Playbook step and</text>
<text x="108" y="820" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stops the job.</text>
