name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # The operator's own Mac, through a self-hosted runner: GitHub's macOS runners queue for 15 minutes or more.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ops-console/frontend exec playwright install chromium
      - run: pnpm check
