<text x="142" y="647" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="676" r="9" fill="#2d3142"/>
<text x="84" y="679.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="680" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A message on an idle or failed Session starts a run. A message sent while the Session works is queued and sent when the run ends. A pr_review Session takes no messages (409 invalid_state).</text>
<circle cx="84" cy="704" r="9" fill="#2d3142"/>
<text x="84" y="707.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="708" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A run is a Claude Agent SDK query() in the folder its kind supplies, resuming the stored SDK session. Runs live in the daemon&#x27;s memory. Stop aborts the query and expires its Approvals; the Session goes to</text>
<text x="108" y="724" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">idle, like a run that finished, while the job that started it sees it fail. Editing the last message rewinds the agent&#x27;s file edits.</text>
<circle cx="84" cy="748" r="9" fill="#2d3142"/>
<text x="84" y="751.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="752" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The agent&#x27;s question reaches the operator through canUseTool. The next message answers it and the Session returns to working.</text>
<circle cx="84" cy="776" r="9" fill="#2d3142"/>
<text x="84" y="779.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="780" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Waits for a supervised-mode prompt, a PROD write (every mode) or open_pull_request. With several Approvals pending the Session returns to working only when none is left. Kinds: prod_write, command, edit.</text>
<circle cx="84" cy="804" r="9" fill="#2d3142"/>
<text x="84" y="807.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="808" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The run ended with an error code, for example a limit with no account to move to, or unauthorized. The failure is shown in the Session and a new message runs again.</text>
<circle cx="84" cy="832" r="9" fill="#2d3142"/>
<text x="84" y="835.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="836" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Before the port opens: Sessions left working, waiting_input or waiting_approval fail and their Approvals expire. A running Agent Review, Report, Fix, Reply check, Comment pass, Playbook step or Scan fails</text>
<text x="108" y="852" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">too (interrupted for all but the Agent Review).</text>
