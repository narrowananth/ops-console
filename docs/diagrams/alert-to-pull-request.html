<text x="78" y="616" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Scans run on a 6 h grid and by hand. The same Fingerprint reopens a resolved Alert, which is a regression.</text>
<text x="78" y="640" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A failed Verification, or a daemon restart (interrupted), returns the Alert to Open. Its scratch copy is removed once the Report is ready.</text>
<text x="78" y="664" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Stale Alerts show overdue; awaiting prod check clears when the Recheck count and the version tag are read. Neither blocks a job.</text>
<text x="78" y="688" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Confirming the Report starts the Fix in the same Session and checkout, in a new conversation. Dismiss is undoable until the Alert moves on.</text>
<text x="78" y="712" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The ticket stage runs only when the Fix Playbook asks and Jira is connected. Otherwise the branch is fix/&lt;slug&gt;.</text>
<text x="78" y="736" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A failed step stops the job. The Fix stays at its stage and a retry resumes there. A retry never makes a second ticket or pull request.</text>
<text x="78" y="760" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Cancel with no PR yet: stop the run, stash changes, delete the Fix branch, back to Verified. With a PR, close it on the Git host.</text>
<text x="78" y="784" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Only the operator merges. Every 5 min and after each list refresh: merged resolves the Alert, closed unmerged abandons the Fix.</text>
