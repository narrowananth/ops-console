600">UI</text><text x="52" y="211.0" font-size="10" fill="#2d3142" class="sans">Small flow on a dotted strip: the Trigger, the first five steps, then "+N more", then a dashed</text><text x="52" y="224.5" font-size="10" fill="#2d3142" class="sans">"Console's own turn" with what the console does after the steps (job Triggers only)</text><rect x="14" y="233.0" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="240.4" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="241.0" font-size="10" fill="#2d3142" class="sans">"View full flow →" on a built-in opens <tspan class="mono" font-size="9" fill="#2d3142">?trigger=&lt;id&gt;&amp;view=flow</tspan>; "Edit flow →" on an own</text><text x="52" y="254.5" font-size="10" fill="#2d3142" class="sans">Playbook opens it</text><rect x="14" y="263.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="270.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="271.0" font-size="10" fill="#4f5d75" class="sans">"No steps: the agent works from the rules alone." On a chat Trigger: "Steps never run on a</text><text x="52" y="284.5" font-size="10" fill="#4f5d75" class="sans">chat: the agent answers with the rules alone."</text><text x="14" y="305.5" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">FACTS</text><line x1="51.0" y1="303.0" x2="481" y2="303.0" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="314.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="321.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="322.0" font-size="10" fill="#2d3142" class="sans">Rules (first four lines), Skills (names A to Z, or None), Branch with Jira ticket ("The Repo's</text><text x="52" y="335.5" font-size="10" fill="#2d3142" class="sans">default branch" when blank; Jira ticket on or off)</text><rect x="14" y="344.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="351.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="352.0" font-size="10" fill="#2d3142" class="sans">Built-in only: a note that it is read only and the console keeps it up to date, and that a copy</text><text x="52" y="365.5" font-size="10" fill="#2d3142" class="sans">comes from + New Playbook, picked in the dropdown</text></g><g transform="translate(531,464)"><rect x="0" y="0" width="495" height="192" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Save and drafts</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">SHOWN WHILE THE BROWSER HOLDS EDITS</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans">Bar: "Unsaved edits", Discard, Save (spinner). A failed Save shows its error beside Save and</text><text x="52" y="67.0" font-size="10" fill="#2d3142" class="sans">keeps the edits</text><rect x="14" y="75.5" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="82.9" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="83.5" font-size="10" fill="#4f5d75" class="sans">Save is off while a step lacks a title or instructions or the name is blank, with a plain line that</text><text x="52" y="97.0" font-size="10" fill="#4f5d75" class="sans">says which: "Step 1 and Step 2 need instructions."</text><rect x="14" y="105.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="112.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="113.5" font-size="10" fill="#2d3142" class="sans">Drafts per Playbook id in <tspan class="mono" font-size="9" fill="#2d3142">ops-console:playbooks.drafts</tspan> survive reloads and reopening</text><text x="52" y="127.0" font-size="10" fill="#2d3142" class="sans">the console until Save or Discard; editing back to the saved text, Save, Discard and Delete</text><text x="52" y="140.5" font-size="10" fill="#2d3142" class="sans">drop one</text><rect x="14" y="149.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="156.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="157.0" font-size="10" fill="#4f5d75" class="sans">Server: step title and instructions required, 409 on built-ins and a duplicate name. Create,</text><text x="52" y="170.5" font-size="10" fill="#4f5d75" class="sans">patch, delete and attach emit no WS event; a second browser refetches on its own</text></g><g transform="translate(1050,64)"><rect x="0" y="0" width="495" height="492" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">The flow</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">AN OPEN PLAYBOOK · PALETTE, CANVAS, PANEL</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="rgba(46,90,168,0.10)" stroke="#2e5aa8 at</text><text x="52" y="281.5" font-size="10" fill="#4f5d75" class="sans">Triggers: the agent replies using the rules."</text><rect x="14" y="290.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="297.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="298.0" font-size="10" fill="#4f5d75" class="sans">Built-in: the same flow, every field read only, a banner "Built-in, read only." that names the</text><text x="52" y="311.5" font-size="10" fill="#4f5d75" class="sans">Playbook replacing it on its Trigger when one does, no palette, no action button; its Skills</text><text x="52" y="325.0" font-size="10" fill="#4f5d75" class="sans">card reads "A built-in holds none."</text><text x="14" y="346.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">PALETTE (LEFT, OWN PLAYBOOKS ONLY)</text><line x1="207.6" y1="343.5" x2="481" y2="343.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="354.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="361.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="362.5" font-size="10" fill="#2d3142" class="sans">Ten Step blocks, Custom step first; the + menu on a line lists them in the same order; hover</text><text x="52" y="376.0" font-size="10" fill="#2d3142" class="sans">shows a block's instructions</text><rect x="14" y="384.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="391.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="392.5" font-size="10" fill="#2d3142" class="sans">Drag a block onto a line to insert a copy there; its + appends one. The added step opens in</text><text x="52" y="406.0" font-size="10" fill="#2d3142" class="sans">the panel</text><rect x="14" y="414.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="421.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="422.5" font-size="10" fill="#2d3142" class="sans">Drag a step to another place to move it; drop it outside the canvas to remove it</text><rect x="14" y="431.0" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="438.4" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="439.0" font-size="10" fill="#2d3142" class="sans">Keyboard: on a focused step, Alt+← or Alt+→ moves it one place and Delete removes it; a</text><text x="52" y="452.5" font-size="10" fill="#2d3142" class="sans">hint under the palette says so. The panel has no Earlier or Later buttons</text><rect x="14" y="461.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="468.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="469.0" font-size="10" fill="#4f5d75" class="sans">At 12 steps: "A Playbook holds 12 steps at most. Remove one first."</text></g><g transform="translate(1569,64)"><rect x="0" y="0" width="495" height="572" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Panels</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">RIGHT · RESIZABLE</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans">Click a node to open its panel; the close button or Escape closes it. Five panels: Trigger,</text><text x="52" y="67.0" font-size="10" fill="#2d3142" class="sans">Step, Rules, Skills, Settings</text><rect x="14" y="75.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="82.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="83.5" font-size="10" fill="#2d3142" class="sans">Resize: drag the bar on the panel's left edge or press ← and →; a double click puts it back.</text><text x="52" y="97.0" font-size="10" fill="#2d3142" class="sans">The width stays through other nodes and reloads, and the canvas keeps room beside it</text><text x="14" y="118.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">TRIGGER AND STEP</text><line x1="110.4" y1="115.5" x2="481" y2="115.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="126.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="133.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="134.5" font-size="10" fill="#2d3142" class="sans">Trigger: chips of the seven Triggers; click to attach, click an attached one to detach (it</text><text x="52" y="148.0" font-size="10" fill="#2d3142" class="sans">returns to its built-in). A Trigger held by another Playbook asks Replace first</text><rect x="14" y="156.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="163.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="164.5" font-size="10" fill="#2d3142" class="sans">Step: title (80), instructions (4000), tag "scratch copy" (a custom step has the checkbox,</text><text x="52" y="178.0" font-size="10" fill="#2d3142" class="sans">writing blocks carry it fixed), Remove; "Runs as its own agent turn. Ends done, skipped or</text><text x="52" y="191.5" font-size="10" fill="#2d3142" class="sans">failed."</text><text x="14" y="212.5" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">RULES</text><line x1="51.0" y1="210.0" x2="481" y2="210.0" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="221.0" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="228.4" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="229.0" font-size="10" fill="#2d3142" class="sans">Rules text up to 8000 characters, sent after the console's own instructions; a fold-out</text><text x="52" y="242.5" font-size="10" fill="#2d3142" class="sans">shows the pull request description rule every run also gets. The box fills the height the panel</text><text x="52" y="256.0" font-size="10" fill="#2d3142" class="sans">leaves</text><rect x="14" y="264.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="271.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="272.5" font-size="10" fill="#2d3142" class="sans">Meter "≈ N tokens, sent on every turn of every run": the text's length divided by four,</text><text x="52" y="286.0" font-size="10" fill="#2d3142" class="sans">rounded up, live as you type; the operator's text only. Up to 1500 characters it adds "Keep</text><text x="52" y="299.5" font-size="10" fill="#2d3142" class="sans">only what is always true; put methods in a Skill."</text><rect x="14" y="308.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="315.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="316.0" font-size="10" fill="#4f5d75" class="sans">Above 1500 characters the meter is tinted and adds "Long. Move how-to text into a Skill." A</text><text x="52" y="329.5" font-size="10" fill="#4f5d75" class="sans">built-in's Rules show the figure without the tint or the warning</text><text x="14" y="350.5" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">SKILLS</text><line x1="56.4" y1="348.0" x2="481" y2="348.0" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="359.0" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="366.4" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="367.0" font-size="10" fill="#2d3142" class="sans">Held Skills with a picker of those not held ("+ Add a Skill"); Remove takes one off the</text><text x="52" y="380.5" font-size="10" fill="#2d3142" class="sans">Playbook and the Skill stays. A built-in: "A built-in Playbook holds no Skills."</text><rect x="14" y="389.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="396.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="397.0" font-size="10" fill="#2d3142" class="sans">With one held, a meter: "≈ N tokens per turn: names and descriptions only. A Skill's full text</text><text x="52" y="410.5" font-size="10" fill="#2d3142" class="sans">costs tokens only when a step loads it"; counted over each held Skill's name and description</text><rect x="14" y="419.0" width="32" height="10" rx="2" fill="rgba(46,90,168,0.10)" stroke="#2e5aa8" stroke-width="0.9"/><text x="30.0" y="426.4" font-size="6.5" text-anchor="middle" fill="#2e5aa8" class="mono" letter-spacing="0.06em" font-weight="600">JUMP</text><text x="52" y="427.0" font-size="10" fill="#2d3142" class="sans">"Open the Skills page →" or a Skill's name opens <tspan class="mono" font-size="9" fill="#2d3142">/skills</tspan> with "← Back to {Playbook}" in its</text><text x="52" y="440.5" font-size="10" fill="#2d3142" class="sans">header; it returns to the same Playbook, unsaved edits kept. Picking a pack or Skill there</text><text x="52" y="454.0" font-size="10" fill="#2d3142" class="sans">keeps the button</text><text x="14" y="475.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">SETTINGS</text><line x1="67.2" y1="472.5" x2="481" y2="472.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="483.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="490.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="491.5" font-size="10" fill="#2d3142" class="sans">Branch: comma list up to 200 characters, tried in order (blank: the Repo's default branch);</text><text x="52" y="505.0" font-size="10" fill="#2d3142" class="sans">Verify and Fix read the newest commit of the first one origin has, fetched first; the server</text><text x="52" y="518.5" font-size="10" fill="#2d3142" class="sans">rejects an option, <tspan class="mono" font-size="9" fill="#2d3142">..</tspan> or a space</text><rect x="14" y="527.0" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="534.4" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="535.0" font-size="10" fill="#2d3142" class="sans">Jira ticket switch: Fix makes a Jira ticket first when Jira is connected and names the branch</text><text x="52" y="548.5" font-size="10" fill="#2d3142" class="sans">after it; off gives <tspan class="mono" font-size="9" fill="#2d3142">fix/&lt;name&gt;</tspan></text></g><g transform="translate(2088,64)"><rect x="0" y="0" width="1014" height="336" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Built-in Playbooks</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">* = SCRATCH COPY STEP</text><text x="14" y="58" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">VERIFY (8)</text><line x1="84" y1="55.5" x2="1000" y2="55.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="66.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="73.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="74.5" font-size="10" fill="#2d3142" class="sans">Investigate the Datadog logs · Map the logs to the code · Analyse consumers and impact · Reproduce it locally* · Check the database, read only · Check Shopify and</text><text x="52" y="88.0" font-size="10" fill="#2d3142" class="sans">external dependencies* · Look for an existing fix · Decide the root cause and the stable fix</text><text x="14" y="109.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">FIX (7)</text><line x1="65" y1="106.5" x2="1000" y2="106.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="117.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="124.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="125.5" font-size="10" fill="#2d3142" class="sans">Confirm the root cause and look for an existing fix · Check dependent services and contracts · Learn the code standards · Implement the stable fix* · Test with mocked</text><text x="52" y="139.0" font-size="10" fill="#2d3142" class="sans">data and dependencies* · Run the full test suite and build* · Review the diff</text><text x="14" y="160.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">REVIEW PR (8)</text><line x1="103" y1="157.5" x2="1000" y2="157.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="168.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="175.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="176.5" font-size="10" fill="#2d3142" class="sans">Read the pull request and its description · Compare with the production baseline · Trace the change through the codebase · Check consumers and dependencies · Review</text><text x="52" y="190.0" font-size="10" fill="#2d3142" class="sans">the database and data flow · Check correctness and production risk · Run the tests and build* · Classify the findings and decide the verdict</text><text x="14" y="211.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">CHECK REPLY (4)</text><line x1="115" y1="208.5" x2="1000" y2="208.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="219.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="226.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="227.5" font-size="10" fill="#2d3142" class="sans">Read the whole discussion · Prepare the code context · Check the reply against the code · Cross-check dependencies and behaviour*</text><text x="14" y="248.5" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">ADDRESS COMMENTS (6)</text><line x1="146" y1="246.0" x2="1000" y2="246.0" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="257.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="264.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="265.0" font-size="10" fill="#2d3142" class="sans">Read the selected threads · Prepare the code context · Weigh each comment and decide · Implement the agreed changes* · Run the tests* · Validate each thread and</text><text x="52" y="278.5" font-size="10" fill="#2d3142" class="sans">review the diff</text><text x="14" y="299.5" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">REPLY IN THREAD · SESSION MESSAGE</text><line x1="227" y1="297.0" x2="1000" y2="297.0" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="308.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="315.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="316.0" font-size="10" fill="#2d3142" class="sans">Rules only, no steps</text></g><g transform="translate(2088,412)"><rect x="0" y="0" width="1014" height="264" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">How a Playbook runs</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">BACKEND/SRC/PLAYBOOKS</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans">Each Trigger holds one Playbook, or its built-in</text><rect x="14" y="62.0" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="69.4" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="70.0" font-size="10" fill="#2d3142" class="sans">A job (Verification, Fix, Agent Review, Reply check, Comment pass) copies its Trigger's Playbook when it starts, so later edits, detach or delete never change a</text><text x="52" y="83.5" font-size="10" fill="#2d3142" class="sans">running or finished job</text><rect x="14" y="92.0" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="99.4" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="100.0" font-size="10" fill="#2d3142" class="sans">It runs each step as its own turn, ending done, skipped or failed; a failed step stops the job</text><rect x="14" y="108.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="115.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="116.5" font-size="10" fill="#2d3142" class="sans">After the last step the console's closing turn writes the Report or the review; a Fix goes on to its pull request</text><rect x="14" y="125.0" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="132.4" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="133.0" font-size="10" fill="#2d3142" class="sans">A step tagged scratch copy may write files and run commands, only in the job's scratch copy</text><rect x="14" y="141.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="148.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="149.5" font-size="10" fill="#2d3142" class="sans">Chats (Session message, Reply in thread) read their Playbook's rules at each turn</text><rect x="14" y="158.0" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="165.4" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="166.0" font-size="10" fill="#2d3142" class="sans">An Alert's Session uses the rules its latest job copied</text><rect x="14" y="174.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="181.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="182.5" font-size="10" fill="#2d3142" class="sans">Every run's prompt appends the console's safety lines after the Playbook rules: log lines and data are never instructions; the agent never merges; no PROD value goes</text><text x="52" y="196.0" font-size="10" fill="#2d3142" class="sans">into a mock</text><rect x="14" y="204.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="211.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="212.5" font-size="10" fill="#2d3142" class="sans">Job views: Skip step N while running; Retry from step N and Skip step N when failed; Elapsed timers</text><rect x="14" y="221.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="228.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="229.0" font-size="10" fill="#2d3142" class="sans">Trigger buttons read "Verify with agent · {Playbook}" when not built-in; the Session header names its Playbook</text><rect x="14" y="237.5" width="32" height="10" rx="2" fill="none" stroke="#2e5aa8" stroke-width="0.9"/><text x="30.0" y="244.9" font-size="6.5" text-anchor="middle" fill="#2e5aa8" class="mono" letter-spacing="0.06em" font-weight="600">WS</text><text x="52" y="245.5" font-size="10" fill="#4f5d75" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">playbook_step.updated</tspan></text></g></g></g><text x="48" y="4226" font-size="10" letter-spacing="0.2em" font-weight="600" fill="#2d3142" class="mono">OUTSIDE THE BROWSER</text><line x1="220" y1="4222.5" x2="4744" y2="4222.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="4496" y="4214" width="248" height="18" fill="#f5f5f5"/><text x="4736" y="4226" font-size="9" text-anchor="end" fill="#5a6580" class="mono">daemon, CLI, install, scheduler, agent runs</text><g transform="translate(0,4244)"><g transform="translate(48,0)"><rect x="0" y="0" width="4688" height="512" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="30" font-size="26" fill="#2d3142" class="ser">Outside the browser</text><text x="14" y="48" font-size="8.5" letter-spacing="0.1em" fill="#2e5aa8" class="mono" font-weight="600">CLI · INSTALL · DAEMON · RUNS</text><text x="210" y="48" font-size="10.5" fill="#4f5d75" class="sans" font-style="italic">everything that runs without a page</text><g transform="translate(12,64)"><rect x="0" y="0" width="562" height="316" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">ops-console CLI</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">CLI/ · NO OR UNKNOWN COMMAND PRINTS USAGE, EXIT 2</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">start</tspan>: already running prints pid and port; else writes the LaunchAgent plist, bootout,</text><text x="52" y="67.0" font-size="10" fill="#2d3142" class="sans">enable, bootstrap, polls <tspan class="mono" font-size="9" fill="#2d3142">/api/health</tspan> every 250 ms up to 15 s</text><text x="52" y="80.5" font-size="10" fill="#2d3142" class="sans">(<tspan class="mono" font-size="9" fill="#2d3142">OPS_CONSOLE_START_TIMEOUT_MS</tspan>)</text><rect x="28" y="89.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="44.0" y="96.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="66" y="97.0" font-size="10" fill="#4f5d75" class="sans">Timeout: bootout, last 20 log lines, exit 1; launchctl failure: printed, exit 1</text><rect x="14" y="105.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="112.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="113.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">stop</tspan>: bootout (waits up to 15 s) and <tspan class="mono" font-size="9" fill="#2d3142">disable</tspan>, so it stays off at login until the next</text><text x="52" y="127.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">start</tspan></text><rect x="14" y="135.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="142.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600" <text x="52" y="220.0" font-size="10" fill="#2d3142" class="sans">was running</text><rect x="14" y="228.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="235.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="236.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">uninstall</tspan>: bootout, removes the plist, <tspan class="mono" font-size="9" fill="#2d3142">~/.ops-console</tspan> and the bin link; keeps data and</text><text x="52" y="250.0" font-size="10" fill="#2d3142" class="sans">logs and names them</text><rect x="14" y="258.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="265.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="266.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">--version</tspan></text><rect x="14" y="275.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="282.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="283.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">bin/ops-console</tspan> shim follows symlinks: <tspan class="mono" font-size="9" fill="#2d3142">daemon</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">mcp-exec</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">mcp-setup</tspan> go to the daemon</text><text x="52" y="296.5" font-size="10" fill="#2d3142" class="sans">bundle, the rest to the CLI</text><line x1="19" y1="55.5" x2="19" y2="94.0" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><line x1="19" y1="94.0" x2="26" y2="94.0" stroke="rgba(45,49,66,0.16)" stroke-width= 2" class="sans">(default 4545); output to the daemon log</text><rect x="14" y="126.5" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="133.9" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="134.5" font-size="10" fill="#4f5d75" class="sans">Switched off under Login Items: no start at login</text><rect x="14" y="143.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="150.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="151.0" font-size="10" fill="#4f5d75" class="sans">Dev build never starts at login: <tspan class="mono" font-size="9" fill="#2d3142">pnpm dev</tspan> runs backend 4556, UI 4555, data</text><text x="52" y="164.5" font-size="10" fill="#4f5d75" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">backend/.data</tspan>, Keychain service <tspan class="mono" font-size="9" fill="#2d3142">ops-console-dev</tspan></text><text x="14" y="185.5" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">START ORDER</text><line x1="90" y1="183.0" x2="548" y2="183.0" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="194.0" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="201.4" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="202.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">mkdir</tspan> and <tspan class="mono" font-size="9" fill="#2d3142">daemon.lock</tspan> → SQLite and migrations (one transaction) → Nest init → start-up</text><text x="52" y="215.5" font-size="10" fill="#2d3142" class="sans">recovery → listen on 127.0.0.1 → Scheduler → <tspan class="mono" font-size="9" fill="#2d3142">runtime.json</tspan> (pid, port, version, token;</text><text x="52" y="229.0" font-size="10" fill="#2d3142" class="sans">0600)</text><rect x="14" y="237.5" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="244.9" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="245.5" font-size="10" fill="#4f5d75" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">EADDRINUSE</tspan>: "port N is already in use"</text><rect x="14" y="254.0" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="261.4" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="262.0" font-size="10" fill="#2d3142" class="sans">Local only (ADR 0003); every <tspan class="mono" font-size="9" fill="#2d3142">/api</tspan> route needs the Bearer token, else 401 <tspan class="mono" font-size="9" fill="#2d3142">unauthorized</tspan>;</text><text x="52" y="275.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">/api/health</tspan> answers status, version, started_at</text><rect x="14" y="284.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="291.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="292.0" font-size="10" fill="#2d3142" class="sans">SIGTERM or SIGINT: clean stop</text><text x="14" y="313.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">START-UP RECOVERY (BEFORE THE PORT OPENS)</text><line x1="276" y1="310.5" x2="548" y2="310.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="321.5" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="328.9" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="329.5" font-size="10" fill="#4f5d75" class="sans">Sessions left working, waiting_input or waiting_approval fail; their Approvals expire</text><rect x="14" y="338.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="345.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="346.0" font-size="10" fill="#4f5d75" class="sans">A running Scan, Report, Fix, Agent Review, Reply check, Comment pass or Playbook step</text><text x="52" y="359.5" font-size="10" fill="#4f5d75" class="sans">fails (<tspan class="mono" font-size="9" fill="#2d3142">interrupted</tspan>, except the Agent Review)</text><rect x="14" y="368.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="375.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="376.0" font-size="10" fill="#4f5d75" class="sans">A failed Report, Reply check or Comment pass keeps its scratch copy (Retry); other</text><text x="52" y="389.5" font-size="10" fill="#4f5d75" class="sans">scratch copies are removed</text></g><g transform="translate(1770,64)"><rect x="0" y="0" width="562" height="436" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Scheduler and Updates</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">IN-PROCESS TIMERS, NO QUEUE</text><text x="14" y="58" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">SCHEDULER (A MISSED SLOT RUNS ONCE AT START)</text><line x1="295" y1="55.5" x2="548" y2="55.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="66.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="73.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="74.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">monitor-scan</tspan>: 6-hour grid from the Datadog Connector's daily scan time; Scans every</text><text x="52" y="88.0" font-size="10" fill="#2d3142" class="sans">Service for each Check interval (6, 12, 24 h) that came due</text><rect x="14" y="96.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="103.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="104.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">monitor-pr-watch</tspan>: every 5 min and after each pull request list refresh; merged resolves</text><text x="52" y="118.0" font-size="10" fill="#2d3142" class="sans">the Alert, closed abandons the Fix</text><rect x="14" y="126.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="133.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="134.5" font-size="10" fill="#2d3142" class="sans">Own timers: Claude usage read (boot, then 5 min); update check (10 s after start, then</text><text x="52" y="148.0" font-size="10" fill="#2d3142" class="sans">every 60 s; 30 s poll while <tspan class="mono" font-size="9" fill="#2d3142">waiting</tspan>)</text><text x="14" y="169.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">UPDATES</text><line x1="65" y1="166.5" x2="548" y2="166.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="177.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="184.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="185.5" font-size="10" fill="#2d3142" class="sans">Status: dev, unknown, up_to_date, available, waiting, updating, failed</text><rect x="14" y="194.0" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="201.4" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="202.0" font-size="10" fill="#2d3142" class="sans">Newest release from the GitHub <tspan class="mono" font-size="9" fill="#2d3142">releases/latest</tspan> redirect (HEAD, no API quota), then the</text><text x="52" y="215.5" font-size="10" fill="#2d3142" class="sans">API once per tag for date and notes</text><rect x="14" y="224.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="231.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="232.0" font-size="10" fill="#4f5d75" class="sans">"Could not reach GitHub: …" leaves the status unchanged; dev build: no timers, check</text><text x="52" y="245.5" font-size="10" fill="#4f5d75" class="sans">and install do nothing or return 409</text><rect x="14" y="254.0" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="261.4" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="262.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">POST /updates</tspan> <tspan class="mono" font-size="9" fill="#2d3142">{when: now|idle}</tspan>: now stops runs; idle waits (<tspan class="mono" font-size="9" fill="#2d3142">waiting</tspan>) until no Session is</text><text x="52" y="275.5" font-size="10" fill="#2d3142" class="sans">working, waiting_input or waiting_approval, polled every 30 s</text><rect x="14" y="284.0" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="291.4" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="292.0" font-size="10" fill="#2d3142" class="sans">Auto-update on and no runs: installs right after a check finds a newer release</text><rect x="14" y="300.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="307.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="308.5" font-size="10" fill="#2d3142" class="sans">Runs the installed <tspan class="mono" font-size="9" fill="#2d3142">install.sh</tspan> with <tspan class="mono" font-size="9" fill="#2d3142">OPS_CONSOLE_VERSION</tspan>; on success the daemon SIGTERMs</text><text x="52" y="322.0" font-size="10" fill="#2d3142" class="sans">itself after 500 ms; launchd restarts it from <tspan class="mono" font-size="9" fill="#2d3142">current</tspan></text><rect x="14" y="330.5" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="337.9" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="338.5" font-size="10" fill="#4f5d75" class="sans">Failure: <tspan class="mono" font-size="9" fill="#2d3142">failed</tspan> "The update to vX did not install: …"; the old version keeps running;</text><text x="52" y="352.0" font-size="10" fill="#4f5d75" class="sans">409 "This is the newest version"</text><rect x="14" y="360.5" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="367.9" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="368.5" font-size="10" fill="#4f5d75" class="sans">A failed state is not cleared by a new release; only Try again retries</text><rect x="14" y="377.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="384.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="385.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">update.json</tspan> (version, previous, at, automatic, pending): the first start on a new</text><text x="52" y="398.5" font-size="10" fill="#2d3142" class="sans">version shows "Updated to"</text><rect x="14" y="407.0" width="32" height="10" rx="2" fill="none" stroke="#2e5aa8" stroke-width="0.9"/><text x="30.0" y="414.4" font-size="6.5" text-anchor="middle" fill="#2e5aa8" class="mono" letter-spacing="0.06em" font-weight="600">WS</text><text x="52" y="415.0" font-size="10" fill="#4f5d75" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">update.changed</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">settings.updated</tspan></text></g><g transform="translate(2356,64)"><rect x="0" y="0" width="562" height="340" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Every agent run</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">BACKEND/SRC/AGENT</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans">Claude Agent SDK <tspan class="mono" font-size="9" fill="#2d3142">query()</tspan> in the working folder the Session's kind supplies, resuming</text><text x="52" y="67.0" font-size="10" fill="#2d3142" class="sans">the stored SDK session</text><rect x="14" y="75.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="82.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="83.5" font-size="10" fill="#2d3142" class="sans">Each Claude account has its own <tspan class="mono" font-size="9" fill="#2d3142">CLAUDE_CONFIG_DIR</tspan> under the data folder; the console</text><text x="52" y="97.0" font-size="10" fill="#2d3142" class="sans">never uses the operator's own Claude Code login</text><rect x="14" y="105.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="112.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="113.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">PreToolUse</tspan> hook writes the Action Log row before every Bash and MCP call, and holds a</text><text x="52" y="127.0" font-size="10" fill="#2d3142" class="sans">PROD write for an Approval in every Access mode</text><rect x="14" y="135.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="142.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="143.5" font-size="10" fill="#2d3142" class="sans">Run sandbox (Seatbelt) built per run from its working folder, the data folder and the</text><text x="52" y="157.0" font-size="10" fill="#2d3142" class="sans">run's kind; fails the run when unavailable</text><rect x="14" y="165.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="172.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="173.5" font-size="10" fill="#2d3142" class="sans">Network allowlist: built-in hosts, each Repo's <tspan class="mono" font-size="9" fill="#2d3142">origin</tspan> host, the operator's</text><text x="52" y="187.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">network_domains</tspan>; the SDK's proxy refuses any other host</text><rect x="14" y="195.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="202.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="203.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">disallowedTools</tspan>: <tspan class="mono" font-size="9" fill="#2d3142">WebFetch</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">WebSearch</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">gh pr merge</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">glab mr merge</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">bkt pr merge</tspan>,</text><text x="52" y="217.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">bkt pr auto-merge</tspan>, the GitHub and GitLab MCP merge tools</text><rect x="14" y="225.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="232.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="233.5" font-size="10" fill="#2d3142" class="sans">Agent Review, Reply check and Comment pass also deny <tspan class="mono" font-size="9" fill="#2d3142">git push</tspan>, the host CLIs' comment,</text><text x="52" y="247.0" font-size="10" fill="#2d3142" class="sans">review and <tspan class="mono" font-size="9" fill="#2d3142">api</tspan> commands, and host MCP comment tools: the console pushes, replies and</text><text x="52" y="260.5" font-size="10" fill="#2d3142" class="sans">resolves</text><rect x="14" y="269.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="276.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="277.0" font-size="10" fill="#4f5d75" class="sans">MCP Servers the operator disabled, and for a <tspan class="mono" font-size="9" fill="#2d3142">devtools</tspan> Session the Connections outside</text><text x="52" y="290.5" font-size="10" fill="#4f5d75" class="sans">its scope, are denied</text><rect x="14" y="299.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="306.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="307.0" font-size="10" fill="#2d3142" class="sans">System prompt order: the kind's instructions, PR-description rules, "the console pushes</text><text x="52" y="320.5" font-size="10" fill="#2d3142" class="sans">and opens pull requests", the Playbook's rules, the console's safety lines</text></g><g transform="translate(2942,64)"><rect x="0" y="0" width="562" height="316" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Run control and accounts</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">BACKEND/SRC/AGENT · ACCOUNTS</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans">Supervised mode: permission prompts and the agent's questions reach <tspan class="mono" font-size="9" fill="#2d3142">canUseTool</tspan> and wait</text><text x="52" y="67.0" font-size="10" fill="#2d3142" class="sans">for the operator</text><rect x="14" y="75.5" width="32" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="82.9" font-size="6.5" text-anchor="middle" fill="#2d3142" class="mono" letter-spacing="0.06em" font-weight="600">ACT</text><text x="52" y="83.5" font-size="10" fill="#2d3142" class="sans">Stop ends a run and expires its Approvals; edit last message rewinds the agent's file</text><text x="52" y="97.0" font-size="10" fill="#2d3142" class="sans">edits</text><rect x="14" y="105.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="112.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="113.5" font-size="10" fill="#2d3142" class="sans">Attached files sit in the Session's <tspan class="mono" font-size="9" fill="#2d3142">attachments/</tspan> folder, added to the run's directories</text><rect x="14" y="122.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="129.4" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="130.0" font-size="10" fill="#2d3142" class="sans">A conversation begun in one folder moves its transcript to the next run's folder, so a</text><text x="52" y="143.5" font-size="10" fill="#2d3142" class="sans">chat after a Verification resumes in the checkout</text><rect x="14" y="152.0" width="32" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9" stroke-dasharray="2,2"/><text x="30.0" y="159.4" font-size="6.5" text-anchor="middle" fill="#4f5d75" class="mono" letter-spacing="0.06em" font-weight="600">STATE</text><text x="52" y="160.0" font-size="10" fill="#4f5d75" class="sans">Runs live in the daemon's memory; a restart fails them and expires their Approvals</text><rect x="14" y="168.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="175.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="176.5" font-size="10" fill="#2d3142" class="sans">With CLIProxy on: runs send its API key and address in place of an account's sign-in;</text><text x="52" y="190.0" font-size="10" fill="#2d3142" class="sans">usage not read; switching off; the address must be loopback</text><rect x="14" y="198.5" width="32" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.9"/><text x="30.0" y="205.9" font-size="6.5" text-anchor="middle" fill="#f5f5f5" class="mono" letter-spacing="0.06em" font-weight="600">RUN</text><text x="52" y="206.5" font-size="10" fill="#2d3142" class="sans">Smart usage and Auto-switch move work between accounts (the operator accepted the terms</text><text x="52" y="220.0" font-size="10" fill="#2d3142" class="sans">risk; both can be turned off)</text><rect x="14" y="228.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="235.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="236.5" font-size="10" fill="#2d3142" class="sans">An account's name is its email; each added once; usage also read for idle accounts</text><text x="52" y="250.0" font-size="10" fill="#2d3142" class="sans">every 5 min</text><rect x="14" y="258.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="265.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="266.5" font-size="10" fill="#2d3142" class="sans">The console never reads a Claude token: sign-in runs in Anthropic's own flow; usage</text><text x="52" y="280.0" font-size="10" fill="#2d3142" class="sans">comes from the SDK's rate-limit events and its usage request</text><rect x="14" y="288.5" width="32" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="30.0" y="295.9" font-size="6.5" text-anchor="middle" fill="#bf4520" class="mono" letter-spacing="0.06em" font-weight="600">GATE</text><text x="52" y="296.5" font-size="10" fill="#2d3142" class="sans">Merge is the operator's button only (ADR 0002); the agent has no merge tool</text></g><g transform="translate(3528,64)"><rect x="0" y="0" width="562" height="348" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Data folder and store</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">~/LIBRARY/APPLICATION SUPPORT/OPS-CONSOLE</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans">Data folder; <tspan class="mono" font-size="9" fill="#2d3142">OPS_CONSOLE_DATA_DIR</tspan> overrides it; log in</text><text x="52" y="67.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">~/Library/Logs/ops-console/daemon.log</tspan></text><text x="14" y="88.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">`STATE.DB` (SQLITE, DRIZZLE) HOLDS</text><line x1="233" y1="85.5" x2="548" y2="85.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="96.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="103.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="104.5" font-size="10" fill="#2d3142" class="sans">Settings the operator changed; Claude accounts; Sessions and the Connections a <tspan class="mono" font-size="9" fill="#2d3142">devtools</tspan></text><text x="52" y="118.0" font-size="10" fill="#2d3142" class="sans">Session names; Action Log and Approvals; MCP Servers removed or disabled</text><rect x="14" y="126.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="133.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="134.5" font-size="10" fill="#2d3142" class="sans">Connectors (config and last check); Connections (no secrets); Repos; Agent Reviews,</text><text x="52" y="148.0" font-size="10" fill="#2d3142" class="sans">Reply checks, Comment passes; ids of comments the agent posted</text><rect x="14" y="156.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="163.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="164.5" font-size="10" fill="#2d3142" class="sans">Services, Routes, Scans and their Route results; Alerts and events; Reports, Reviews,</text><text x="52" y="178.0" font-size="10" fill="#2d3142" class="sans">Fixes; Playbooks, their Triggers, each job's copy of its steps</text><text x="14" y="199.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">FILES BESIDE IT</text><line x1="115" y1="196.5" x2="548" y2="196.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="207.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="214.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="215.5" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">runtime.json</tspan> (pid, port, version, session token, 0600), <tspan class="mono" font-size="9" fill="#2d3142">daemon.lock</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">update.json</tspan>,</text><text x="52" y="229.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">keychain-owner.json</tspan></text><rect x="14" y="237.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="244.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="245.5" font-size="10" fill="#2d3142" class="sans">Folders: <tspan class="mono" font-size="9" fill="#2d3142">accounts/</tspan> (each account's config dir), <tspan class="mono" font-size="9" fill="#2d3142">anonymous/</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">attachments/</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">pr-scratch/</tspan>,</text><text x="52" y="259.0" font-size="10" fill="#2d3142" class="sans"><tspan class="mono" font-size="9" fill="#2d3142">scratch/</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">devtools/</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">terminals/</tspan>, <tspan class="mono" font-size="9" fill="#2d3142">mcp-local/</tspan></text><text x="14" y="280.0" font-size="7.5" letter-spacing="0.12em" font-weight="500" fill="#2d3142" class="mono">ELSEWHERE</text><line x1="78" y1="277.5" x2="548" y2="277.5" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="14" y="288.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="295.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="296.5" font-size="10" fill="#2d3142" class="sans">Pull requests stay on the Git host; Session messages stay in the Claude Code transcript</text><text x="52" y="310.0" font-size="10" fill="#2d3142" class="sans">in the Session's account config dir</text><rect x="14" y="318.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="325.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="326.5" font-size="10" fill="#2d3142" class="sans">Secrets live in the macOS Keychain (<tspan class="mono" font-size="9" fill="#2d3142">@napi-rs/keyring</tspan>)</text></g><g transform="translate(4114,64)"><rect x="0" y="0" width="562" height="360" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="14" y="23" font-size="13" font-weight="600" fill="#2d3142" class="sans">Outside systems</text><text x="14" y="35" font-size="7" letter-spacing="0.14em" fill="#5a6580" class="mono">ADR 0005</text><rect x="14" y="45.5" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="30.0" y="52.9" font-size="6.5" text-anchor="middle" fill="#5a6580" class="mono" letter-spacing="0.06em" font-weight="600">UI</text><text x="52" y="53.5" font-size="10" fill="#2d3142" class="sans">Every outside system is an MCP server or a CLI registered with Claude Code</text><rect x="14" y="62.0" width="32" height="10" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><
