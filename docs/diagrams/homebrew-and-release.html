<desc id="homebrew-and-release-desc">A v-tag push runs the release workflow, which builds and checks a tarball per architecture, publishes them with checksums and commits the Homebrew formula to main; brew install puts the Brew entry command on the Mac, and its first run installs the app from the kept tarball into the home folder.</desc>

<rect x="56" y="684" width="1348" height="272" rx="8" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="72" y="678" width="140" height="12" fill="#f5f5f5"/><text x="142" y="687" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text><circle cx="84" cy="716" r="9" fill="#2d3142"/><text x="84" y="719.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text><text x="108" y="720" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A v* tag runs release.yml. Each architecture builds on GitHub&#x27;s macOS runner of its own kind with Node 24: scripts/package.mjs bundles Node, the daemon, the UI with the DevTools frontend, the CLI and native modules.</text><text x="108" y="736" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The Google OAuth client comes from the release&#x27;s secrets and exists only in the tarball. The job installs that tarball and runs start, status, open and stop under launchd before it uploads.</text><circle cx="84" cy="760" r="9" fill="#2d3142"/><text x="84" y="763.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text><text x="108" y="764" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The publish job attaches both tarballs and one checksums.txt to the GitHub release with generated notes. install.sh downloads from the same release, and the running console finds new releases there.</text><circle cx="84" cy="788" r="9" fill="#2d3142"/><text x="84" y="791.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text><text x="108" y="792" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The tap job renders the formula from scripts/homebrew&#x27;s template, the entry script and the release&#x27;s sha256 sums. It checks the formula from a local tap with brew style, brew audit --strict, brew install and brew test,</text><text x="108" y="808" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and only then commits Formula/ops-console.rb to main as Chore: ops-console formula &lt;version&gt;. A failure leaves the published release as it is; rerun the job.</text><circle cx="84" cy="832" r="9" fill="#2d3142"/><text x="84" y="835.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text><text x="108" y="836" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The tap is this repository: brew tap takes its URL. The formula has a tarball for each architecture. Its install step keeps the tarball, a checksums.txt line, the tarball&#x27;s install.sh and a VERSION file,</text><text x="108" y="852" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and writes bin/ops-console, the Brew entry command. A formula cannot write to the home folder, so brew install installs no app.</text><circle cx="84" cy="876" r="9" fill="#2d3142"/><text x="84" y="879.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text><text x="108" y="880" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The first ops-console command on a Mac with no app, and the first after brew upgrade brings a newer formula, runs install.sh against the kept tarball with OPS_CONSOLE_RELEASE_URL and OPS_CONSOLE_NO_LINK set.</text><text x="108" y="896" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A running daemon is stopped and started on the new version. The command never installs over a newer app, and update and uninstall act on the installed app as it is.</text><circle cx="84" cy="920" r="9" fill="#2d3142"/><text x="84" y="923.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text><text x="108" y="924" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">An Intel Homebrew on an Apple silicon Mac is refused with a message. brew uninstall leaves the app: run ops-console uninstall first, which keeps data and logs. The app then updates itself past the formula.</text>
