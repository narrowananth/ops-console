packages:
  - shared
  - backend
  - frontend
  - cli
allowBuilds:
  esbuild: true
  better-sqlite3: true
  node-pty: true
# Two self-hosted runners, arm64 and x64, share one pnpm; install the native packages of both so biome, esbuild and
# the others start under whichever node the job gets.
supportedArchitectures:
  os:
    - current
  cpu:
    - arm64
    - x64

# The runners share one home link; pnpm's default of many parallel downloads stalls each of them and the install
# times out on the native packages (biome, esbuild, better-sqlite3). Four at a time finishes.
networkConcurrency: 4
fetchTimeout: 120000
fetchRetries: 4
