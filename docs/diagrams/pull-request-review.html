<title id="pull-request-review-title">From the pull request list to a merge</title>
<desc id="pull-request-review-desc">How a Workspace pull request moves: the list is read from the Git host, the page checks for merge conflicts in the background, Review with agent, Address comments and Check replies each open a PR action Session in a detached worktree at the head commit, the Session ends in one tool call the console turns into posts, commits and pushes, and only the operator approves or merges.</desc>

<text x="142" y="647" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="676" r="9" fill="#2d3142"/>
<text x="84" y="679.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="680" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Lists span every repository of every owner on each connected Git host, plus imported Repos under other owners, grouped by what the operator does next: Changes requested, Checks failing,</text>
<text x="108" y="696" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">To review, Waiting on review, Ready to merge, Merged or closed. A list older than 30 minutes (a detail older than 15 s) is served at once while a read runs in the background. A failed read</text>
<text x="108" y="712" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">keeps the old list and marks it stale.</text>
<circle cx="84" cy="736" r="9" fill="#2d3142"/>
<text x="84" y="739.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="740" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">One PR action Session per pull request and action at a time: a second press is refused with 409 session_busy, and the button waits until the Session posts or is deleted. Review with agent is</text>
<text x="108" y="756" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">refused for a commit the agent already reviewed. Address comments needs ticked open threads; Check replies takes every open thread whose newest comment is not the agent&#x27;s.</text>
<circle cx="84" cy="780" r="9" fill="#2d3142"/>
<text x="84" y="783.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="784" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A PR action Session is a repo Session in a detached worktree at the head commit, fetched from origin first. A pull request from a fork has no branch to fetch and fails before any code runs.</text>
<text x="108" y="800" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The Playbook of the Trigger is the opening prompt and the operator can steer in the chat. It loads no .claude settings, hooks, servers or CLAUDE.md from that code and has no browser or process tools.</text>
<text x="108" y="816" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Its tool call needs no Approval: pressing the button was it. The Session denies git push, the host CLIs&#x27; comment, review and api commands and the host MCP write tools,</text>
<text x="108" y="832" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and a host write through run_integration is refused.</text>
<circle cx="84" cy="856" r="9" fill="#2d3142"/>
<text x="84" y="859.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="860" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Review with agent compares the change with the target branch, may run the tests and build, and ends in submit_review: a decision, findings and a report. The console posts each finding on its line,</text>
<text x="108" y="876" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">pointing to an open agent thread on the same line instead of a second one, then one summary comment. The agent never approves.</text>
<circle cx="84" cy="900" r="9" fill="#2d3142"/>
<text x="84" y="903.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="904" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The agent changes code to meet the ticked threads, the operator&#x27;s or a teammate&#x27;s, and ends in submit_thread_results: each thread done, already_addressed or declined, with a reply. The console makes</text>
<text x="108" y="920" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">one commit and pushes HEAD to the pull request&#x27;s branch, never forced and rebased if it moved, then replies and resolves done and already_addressed threads. No change makes no commit;</text>
<text x="108" y="936" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a rebase conflict posts nothing.</text>
<circle cx="84" cy="960" r="9" fill="#2d3142"/>
<text x="84" y="963.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="964" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Check replies compares each thread with the code at the head and ends in submit_reply_verdicts: fixed, partly_fixed or not_fixed, with a reply. The console replies and resolves fixed threads.</text>
<text x="108" y="980" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">It commits and pushes nothing. If a post fails, the tool says which threads are left and a second call posts only those.</text>
<circle cx="84" cy="1004" r="9" fill="#2d3142"/>
<text x="84" y="1007.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text>
<text x="108" y="1008" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Approve is the operator&#x27;s own and is hidden on their own pull request. Merge needs an approved review and no conflict, asks &quot;Merge #n on the host?&quot;, and writes an Action Log row. A host</text>
<text x="108" y="1024" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">refusal shows upstream_failed.</text>
<circle cx="84" cy="1048" r="9" fill="#2d3142"/>
<text x="84" y="1051.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">8</text>
<text x="108" y="1052" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A merged or closed pull request hides Approve, Request changes, Review with agent, Merge and Address comments. Comments, replies and resolve stay. The agent has no merge path.</text>
<circle cx="84" cy="1076" r="9" fill="#2d3142"/>
<text x="84" y="1079.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">9</text>
<text x="108" y="1080" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The sidebar shows &quot;N of 5 merge checks passed&quot;: approval, checks, conflicts, open threads, agent review. The conflict check fetches the base and the head into the Repo&#x27;s folder and runs</text>
<text x="108" y="1096" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">git merge-tree, which touches no branch. It is kept 2 minutes per head commit. With conflicts, Overview names each file and Merge is disabled; when git cannot fetch, it says Conflicts not known.</text>
