name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One Mac builds both: the install test below starts the daemon on its port, so the builds run in turn.
      max-parallel: 1
      matrix:
        include:
          - label: ARM64
            arch: arm64
          - label: X64
            arch: x64
    # A self-hosted runner of the build's own architecture; each runner carries its label.
    runs-on: [self-hosted, "${{ matrix.label }}"]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: node scripts/package.mjs "${GITHUB_REF_NAME#v}"
      - name: Install the built tarball and run it under launchd
        run: |
          set -eu
          # install.sh installs the arm64 build in a shell under Rosetta, so an Intel runner on an Apple silicon Mac
          # cannot install the x64 tarball. The build above still ran.
          if [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 1 ]; then
            echo "Under Rosetta: install.sh picks arm64 here, so the install test is skipped."
            exit 0
          fi
          mkdir release
          cp "out/ops-console-darwin-${{ matrix.arch }}.tar.gz" release/
          (cd release && shasum -a 256 ops-console-darwin-*.tar.gz > checksums.txt)
          OPS_CONSOLE_RELEASE_URL="file://$PWD/release" sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          test "$(ops-console --version)" = "${GITHUB_REF_NAME#v}"
          ops-console start
          ops-console status
          ops-console open
          ops-console stop
          code=0; ops-console status || code=$?
          test "$code" = 3
      - name: Daemon log
        if: failure()
        run: cat "$HOME/Library/Logs/ops-console/daemon.log" || true
      - uses: actions/upload-artifact@v6
        with:
          name: ops-console-darwin-${{ matrix.arch }}
          path: out/ops-console-darwin-${{ matrix.arch }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Attach tarballs and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum ops-console-darwin-*.tar.gz > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            ops-console-darwin-arm64.tar.gz ops-console-darwin-x64.tar.gz checksums.txt
