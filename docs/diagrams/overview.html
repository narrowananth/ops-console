<title id="overview-title">Ops Console: system overview</title>
<desc id="overview-desc">Architecture of Ops Console: a browser UI of twelve pages talks over REST, a WebSocket and session streams to a local NestJS daemon. Its feature modules start agent runs through the Claude Agent SDK, whose shell commands run in a Keychain-guarding sandbox. The daemon reads Datadog, log sources and Git hosts through CLIs and hosted MCP servers, drives a headless Chrome for Session pages, and keeps state in SQLite, the Keychain and a data folder.</desc>
