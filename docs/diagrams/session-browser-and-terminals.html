<title id="session-browser-and-terminals-title">A Session’s browser, servers and terminals</title>
<desc id="session-browser-and-terminals-desc">How a Session shows a page and runs processes: the Browser panel draws the Session’s own headless Chrome from a JPEG stream and sends input back, Inspect and Element pick attach to the same tab, the agent drives loopback pages with its browser tools, and the Terminals dock runs Session processes as the operator, outside the Run sandbox, beside the Local servers they start.</desc>

<rect x="56" y="772" width="1348" height="408" rx="8" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><rect x="72" y="766" width="140" height="12" fill="#f5f5f5"/><text x="142" y="775" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text><circle cx="84" cy="804" r="9" fill="#2d3142"/><text x="84" y="807.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text><text x="108" y="808" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The panel is offered in Repo and Anonymous Sessions and needs Google Chrome (OPS_CONSOLE_CHROME_PATH names another). One Chrome runs a Session&#x27;s tabs.</text><text x="108" y="824" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">It starts with the first tab and closes after 10 min with no viewer, Inspect window or agent call. Its profile folder stays; Clear cookies deletes it.</text><text x="108" y="840" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The operator&#x27;s address field opens any http or https page, and a bare port opens localhost.</text><circle cx="84" cy="864" r="9" fill="#2d3142"/><text x="84" y="867.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text><text x="108" y="868" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A frame is a binary message: the page&#x27;s CSS size, then a JPEG at the page&#x27;s device scale. Chrome runs at 2x, so a Retina panel gets sharp frames.</text><text x="108" y="884" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Each frame is acknowledged before Chrome sends the next, so a slow viewer slows the page. Mouse, key, text and resize messages go back in the order they came.</text><circle cx="84" cy="908" r="9" fill="#2d3142"/><text x="84" y="911.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text><text x="108" y="912" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Chrome starts with no extensions, sync, updates or background requests, and with no remote debugging port. The page can call any host; the tab lists the outside hosts it called. Nothing is blocked.</text><circle cx="84" cy="936" r="9" fill="#2d3142"/><text x="84" y="939.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text><text x="108" y="940" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">browser_open reuses the agent&#x27;s own tab and refuses any address but loopback, and the console&#x27;s own ports. Every browser tool runs with no Approval except browser_evaluate.</text><text x="108" y="956" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Only a chat the operator started has them: no job, PR action Session, pr_review Session or read-only run.</text><circle cx="84" cy="980" r="9" fill="#2d3142"/><text x="84" y="983.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text><text x="108" y="984" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Pick mode shows Chrome&#x27;s own highlight in the stream. A click goes to the picker, not the page, and takes the tag, selector, accessible name, text, HTML, box, styles and a crop.</text><text x="108" y="1000" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">It never reads a typed value, cookie or storage, and redacts secret-looking text. The pick lands in the composer.</text><circle cx="84" cy="1024" r="9" fill="#2d3142"/><text x="84" y="1027.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text><text x="108" y="1028" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Inspect shows the real Chrome DevTools frontend, built from a pinned revision and served by the daemon, docked or in a window; a tab takes 3 windows.</text><text x="108" y="1044" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The relay forwards DevTools&#x27; own domains and a few read-only Page, Security and Target methods. It refuses Browser, Fetch, Tracing, Input, Emulation and the file and interception methods.</text><circle cx="84" cy="1068" r="9" fill="#2d3142"/><text x="84" y="1071.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text><text x="108" y="1072" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A Session process is a command the daemon starts as the operator in the Session&#x27;s worktree or an Opened Repo&#x27;s, with the login shell&#x27;s environment read once per folder.</text><text x="108" y="1088" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">It runs until stopped, the Session is deleted or the daemon exits; hiding the dock leaves it running, and the dock replays the last 256 KB of output.</text><text x="108" y="1104" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The agent&#x27;s start_process asks first, in every Access mode but full, and names the PROD Connections the folder&#x27;s .env holds.</text><circle cx="84" cy="1128" r="9" fill="#2d3142"/><text x="84" y="1131.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">8</text><text x="108" y="1132" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Local servers lists loopback listeners that belong to the Session: one a Session process started, or one running in its folders. The console&#x27;s own ports and Claude Code&#x27;s sandbox proxy are left out.</text><text x="108" y="1148" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A blank tab lists them; Open loads one in the tab, and Stop appears for a server no Session process owns.</text>
