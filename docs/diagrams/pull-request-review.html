<rect x="56" y="644" width="1348" height="312" rx="8" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
<rect x="72" y="638" width="140" height="12" fill="#f5f5f5"/>
<text x="142" y="647" fill="#5a6580" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE CASES AND TIPS</text>
<circle cx="84" cy="676" r="9" fill="#2d3142"/>
<text x="84" y="679.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
<text x="108" y="680" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Lists span every repository of every owner on each connected Git host, plus imported Repos under other owners. A list older than 60 s (a detail older than 15 s) is served at once while a read runs in the</text>
<text x="108" y="696" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">background. A failed read keeps the old list and marks it stale. GitLab lists and opens on the host only.</text>
<circle cx="84" cy="720" r="9" fill="#2d3142"/>
<text x="84" y="723.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
<text x="108" y="724" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">One job per pull request at a time: a second one is refused with 409 session_busy. Stop fails the job as stopped by the operator and posts nothing. A daemon restart fails every running job.</text>
<circle cx="84" cy="748" r="9" fill="#2d3142"/>
<text x="84" y="751.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
<text x="108" y="752" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A job gets a throwaway scratch copy at the pull request head commit only when a step is tagged scratch copy. It is deleted when the job is ready and kept when it fails, so Retry resumes at the failed step.</text>
<circle cx="84" cy="776" r="9" fill="#2d3142"/>
<text x="84" y="779.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text>
<text x="108" y="780" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Agent Review fetches the target branch, may run the tests and build, and writes findings, a PROD readiness checklist and a verdict. The console posts each finding as an inline comment, plus one summary</text>
<text x="108" y="796" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">comment. The agent never approves.</text>
<circle cx="84" cy="820" r="9" fill="#2d3142"/>
<text x="84" y="823.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5</text>
<text x="108" y="824" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The agent edits the scratch copy and returns each thread as done or declined. The console makes one commit, pushes without force, replies, and resolves done threads. A pass that changes nothing makes no</text>
<text x="108" y="840" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">commit and no push.</text>
<circle cx="84" cy="864" r="9" fill="#2d3142"/>
<text x="84" y="867.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6</text>
<text x="108" y="868" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">One run over every replied thread gives a verdict. The console replies and resolves fixed threads. It changes, commits and pushes nothing.</text>
<circle cx="84" cy="892" r="9" fill="#2d3142"/>
<text x="84" y="895.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7</text>
<text x="108" y="896" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Approve is the operator&#x27;s own and is hidden on their own pull request. Merge needs an approved review, asks &quot;Merge #n on the host?&quot;, and writes an Action Log row. A host refusal shows upstream_failed.</text>
<circle cx="84" cy="920" r="9" fill="#2d3142"/>
<text x="84" y="923.2" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">8</text>
<text x="108" y="924" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A merged or closed pull request hides Approve, Request changes, Agent Review, Merge and Address comments. Comments, replies and resolve stay.</text>
<path d="M 56,992 L 1404,992" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
