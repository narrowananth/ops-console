# A Postgres Connection with Access Level `read` starts dbhub with this file. dbhub fills `${DSN}` from the env the
# launcher reads from the Keychain, so no secret is written here. `search_objects` only reads the catalog.

[[sources]]
id = "default"
dsn = "${DSN}"

[[tools]]
name = "execute_sql"
source = "default"
readonly = true

[[tools]]
name = "search_objects"
source = "default"
